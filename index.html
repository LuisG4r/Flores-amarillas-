<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1.0,
  maximum-scale=1.0,
  user-scalable=no"
>

<meta name="theme-color" content="#f4eddb">

<title>Para ti 🌻</title>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f4eddb;
}


/* =====================================================
   ESCENA INICIAL
===================================================== */

#intro {
    position: relative;

    width: 100vw;
    height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #fbf7ec 0%,
            #f4eddb 65%,
            #eee2c9 100%
        );

    transition: opacity 1.2s ease;
}


/* Textura de papel */

#intro::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    opacity: 0.18;

    background-image:
        radial-gradient(
            rgba(100, 75, 35, 0.18) 0.7px,
            transparent 0.7px
        );

    background-size: 5px 5px;
}


.intro-content {
    position: relative;
    z-index: 5;

    display: flex;
    flex-direction: column;
    align-items: center;

    transform: translateY(-3%);
}


/* =====================================================
   GIRASOL PRINCIPAL
===================================================== */

.sunflower-button {
    position: relative;

    width: 210px;
    height: 210px;

    border: none;
    outline: none;

    background: transparent;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

    transition:
        transform 0.8s ease,
        opacity 0.8s ease;
}

.sunflower-button:active {
    transform: scale(0.94);
}


/* Pétalos */

.petal {
    position: absolute;

    width: 60px;
    height: 96px;

    left: 50%;
    top: 50%;

    margin-left: -30px;
    margin-top: -48px;

    border-radius:
        55% 55% 48% 48%;

    transform-origin: 50% 50%;

    background:
        linear-gradient(
            145deg,
            #ffe982,
            #f5c82d 60%,
            #dda715
        );

    box-shadow:
        inset -4px -5px 8px
        rgba(150, 105, 10, 0.18);

    animation:
        flowerBreath 4s ease-in-out infinite;
}

.p1 { transform: rotate(0deg) translateY(-48px); }
.p2 { transform: rotate(45deg) translateY(-48px); }
.p3 { transform: rotate(90deg) translateY(-48px); }
.p4 { transform: rotate(135deg) translateY(-48px); }
.p5 { transform: rotate(180deg) translateY(-48px); }
.p6 { transform: rotate(225deg) translateY(-48px); }
.p7 { transform: rotate(270deg) translateY(-48px); }
.p8 { transform: rotate(315deg) translateY(-48px); }


/* Centro perfectamente centrado */

.flower-center {
    position: absolute;

    width: 78px;
    height: 78px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #936626,
            #553610 55%,
            #321e09 100%
        );

    box-shadow:
        inset 0 0 0 6px
        rgba(75, 45, 8, 0.4),

        0 8px 20px
        rgba(90, 60, 15, 0.16);

    z-index: 3;
}


.flower-center::before {
    content: "";

    position: absolute;
    inset: 12px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 220, 100, 0.28) 1px,
            transparent 1.5px
        );

    background-size: 7px 7px;
}


@keyframes flowerBreath {

    0%,
    100% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(1.05);
    }
}


/* =====================================================
   TEXTO
===================================================== */

.instruction {
    margin-top: 4px;

    color: #655436;

    font-size: 18px;

    letter-spacing: 1px;

    text-align: center;

    animation:
        textPulse 2.2s ease-in-out infinite;
}


.instruction::after {
    content: "";

    display: block;

    width: 1px;
    height: 30px;

    background: #806b42;

    margin: 9px auto 0;
}


@keyframes textPulse {

    0%,
    100% {
        opacity: 0.5;
    }

    50% {
        opacity: 1;
    }
}


/* =====================================================
   EFECTO DE ONDA
===================================================== */

.ripple {
    position: absolute;

    width: 20px;
    height: 20px;

    left: 50%;
    top: 50%;

    border-radius: 50%;

    border:
        2px solid
        rgba(190, 145, 37, 0.55);

    transform:
        translate(-50%, -50%)
        scale(0);

    pointer-events: none;
}


.ripple.active {
    animation:
        rippleEffect 1s ease-out
        forwards;
}


@keyframes rippleEffect {

    0% {
        opacity: 0.8;

        transform:
            translate(-50%, -50%)
            scale(0);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(14);
    }
}


/* =====================================================
   ESCENA DEL JARDÍN
===================================================== */

#garden {
    position: fixed;
    inset: 0;

    display: none;

    overflow: hidden;

    opacity: 0;

    background:
        linear-gradient(
            to bottom,
            #a8d2dc 0%,
            #c7dedb 48%,
            #e4d7ad 67%,
            #71994b 68%,
            #4d7836 100%
        );

    transition:
        opacity 1.5s ease;
}


/* =====================================================
   CIELO
===================================================== */

.sky {
    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    height: 69%;

    background:
        linear-gradient(
            to bottom,
            #9fcfda 0%,
            #cce2df 65%,
            #e6dfc2 100%
        );

    z-index: 1;
}


/* =====================================================
   LUZ DEL SOL
===================================================== */

.sun-glow {
    position: absolute;

    width: 180px;
    height: 180px;

    right: 10%;
    top: 8%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 239, 168, 0.75),
            rgba(255, 239, 168, 0) 70%
        );

    z-index: 2;
}


/* =====================================================
   TIERRA
===================================================== */

.soil {
    position: absolute;

    left: 5%;
    right: 5%;

    bottom: 26%;

    height: 9%;

    border-radius:
        45% 45% 10% 10%;

    background:
        linear-gradient(
            to bottom,
            #795632,
            #50361f
        );

    transform:
        scaleY(0);

    transform-origin: bottom;

    transition:
        transform 1.4s ease;

    z-index: 4;
}


#garden.grow-soil .soil {
    transform:
        scaleY(1);
}


/* =====================================================
   PASTO
===================================================== */

.grass {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 28%;

    background:
        linear-gradient(
            to bottom,
            #729b4c,
            #486f35
        );

    transform:
        scaleY(0);

    transform-origin: bottom;

    transition:
        transform 2.2s ease;

    z-index: 3;
}


#garden.grow-grass .grass {
    transform:
        scaleY(1);
}


.grass::after {
    content: "";

    position: absolute;
    inset: 0;

    opacity: 0.35;

    background:
        repeating-linear-gradient(
            75deg,
            transparent 0 8px,
            rgba(135, 175, 85, 0.35) 9px 11px
        );
}


/* =====================================================
   BROTE
===================================================== */

.sprout {
    position: absolute;

    left: 50%;
    bottom: 27%;

    width: 7px;
    height: 70px;

    background:
        linear-gradient(
            to right,
            #315f27,
            #57963c
        );

    border-radius: 10px;

    transform:
        translateX(-50%)
        scaleY(0);

    transform-origin: bottom;

    z-index: 8;

    transition:
        transform 1.7s
        cubic-bezier(.2,.8,.2,1);
}


#garden.grow-sprout .sprout {
    transform:
        translateX(-50%)
        scaleY(1);
}


.sprout::before,
.sprout::after {
    content: "";

    position: absolute;

    width: 42px;
    height: 21px;

    background: #4c8b36;

    border-radius:
        100% 0 100% 0;
}


.sprout::before {
    left: -36px;
    top: 32px;

    transform:
        rotate(-18deg);
}


.sprout::after {
    right: -36px;
    top: 17px;

    transform:
        scaleX(-1)
        rotate(-18deg);
}


/* =====================================================
   ZONA DE GIRASOLES
===================================================== */

.sunflower-field {
    position: absolute;

    /*
       El campo solamente ocupa
       la parte inferior.

       Esto deja libre el cielo
       y el tendedero.
    */

    left: 4%;
    right: 4%;

    bottom: 21%;

    height: 40%;

    overflow: hidden;

    z-index: 10;

    opacity: 0;

    transition:
        opacity 1.5s ease;
}


#garden.show-field .sunflower-field {
    opacity: 1;
}


/* =====================================================
   GIRASOLES DEL CAMPO
===================================================== */

.field-flower {
    position: absolute;

    width: 70px;
    height: 125px;

    transform:
        scale(0);

    transform-origin:
        bottom center;

    cursor: pointer;
}


#garden.show-field .field-flower {
    animation:
        flowerGrow 0.8s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


@keyframes flowerGrow {

    0% {
        transform:
            scale(0)
            translateY(25px);
    }

    70% {
        transform:
            scale(1.05)
            translateY(-2px);
    }

    100% {
        transform:
            scale(1)
            translateY(0);
    }
}


/* =====================================================
   TALLO
===================================================== */

.field-stem {
    position: absolute;

    width: 6px;
    height: 88px;

    left: 32px;
    bottom: 0;

    background:
        linear-gradient(
            to right,
            #315c26,
            #57913a
        );

    border-radius: 10px;
}


/* =====================================================
   HOJAS
===================================================== */

.field-leaf {
    position: absolute;

    width: 34px;
    height: 17px;

    background: #4d8735;

    border-radius:
        100% 0;
}


.field-leaf.left {
    left: 0;
    bottom: 30px;

    transform:
        rotate(-20deg);
}


.field-leaf.right {
    right: 0;
    bottom: 47px;

    transform:
        scaleX(-1)
        rotate(20deg);
}


/* =====================================================
   CABEZA DEL GIRASOL
===================================================== */

.field-head {
    position: absolute;

    width: 52px;
    height: 52px;

    left: 9px;
    top: 0;
}


/* Pétalos */

.field-petal {
    position: absolute;

    width: 18px;
    height: 29px;

    left: 17px;
    top: 11px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #ffe77a,
            #eebc21
        );

    transform-origin:
        50% 50%;
}


.fp1 { transform: rotate(0deg) translateY(-16px); }
.fp2 { transform: rotate(45deg) translateY(-16px); }
.fp3 { transform: rotate(90deg) translateY(-16px); }
.fp4 { transform: rotate(135deg) translateY(-16px); }
.fp5 { transform: rotate(180deg) translateY(-16px); }
.fp6 { transform: rotate(225deg) translateY(-16px); }
.fp7 { transform: rotate(270deg) translateY(-16px); }
.fp8 { transform: rotate(315deg) translateY(-16px); }


.field-center {
    position: absolute;

    width: 26px;
    height: 26px;

    left: 13px;
    top: 13px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #80551b,
            #382008
        );

    z-index: 3;
}


/* =====================================================
   TENDEDERO
===================================================== */

.clothesline {
    position: absolute;

    z-index: 30;

    top: 6%;

    left: 7%;

    width: 86%;

    height: 100px;

    opacity: 0;

    transform:
        translateY(-20px);

    transition:
        opacity 1.3s ease,
        transform 1.3s ease;
}


#garden.show-line .clothesline {
    opacity: 1;

    transform:
        translateY(0);
}


/* Cuerda */

.rope {
    position: absolute;

    left: 2%;
    right: 2%;

    top: 32px;

    height: 4px;

    background:
        #68492a;

    border-radius: 50%;

    box-shadow:
        0 2px 3px
        rgba(0,0,0,.18);
}


/* Postes */

.line-post {
    position: absolute;

    width: 9px;
    height: 105px;

    top: 7px;

    background:
        #664728;

    border-radius: 5px;
}


.line-post.left {
    left: 0;
}


.line-post.right {
    right: 0;
}


/* =====================================================
   MENSAJE
===================================================== */

.garden-message {
    position: absolute;

    z-index: 40;

    left: 50%;

    bottom: 4%;

    width: 90%;
    max-width: 700px;

    text-align: center;

    color:
        #fff9df;

    text-shadow:
        0 2px 5px
        rgba(0,0,0,.4);

    opacity: 0;

    transform:
        translateX(-50%)
        translateY(20px);

    transition:
        opacity 1.3s ease,
        transform 1.3s ease;
}


#garden.show-message .garden-message {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}


.garden-message h1 {
    font-size:
        clamp(20px, 4vw, 32px);

    margin-bottom: 7px;
}


.garden-message p {
    font-size:
        clamp(13px, 2vw, 17px);

    line-height: 1.4;
}


/* =====================================================
   MENSAJE PARA VERTICAL
===================================================== */

#rotate-message {
    position: fixed;

    inset: 0;

    z-index: 999;

    display: none;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;

    background:
        #f4eddb;

    color:
        #554527;
}


.rotate-content {
    max-width: 320px;
}


.rotate-icon {
    font-size: 55px;

    margin-bottom: 20px;

    animation:
        rotatePhone 2s
        ease-in-out infinite;
}


.rotate-content h2 {
    font-size: 25px;

    margin-bottom: 12px;
}


.rotate-content p {
    font-size: 16px;

    line-height: 1.6;

    color: #756342;
}


@keyframes rotatePhone {

    0%,
    100% {
        transform:
            rotate(0deg);
    }

    50% {
        transform:
            rotate(90deg);
    }
}


/* =====================================================
   VERTICAL
===================================================== */

@media
(orientation: portrait)
and (max-width: 900px) {

    #rotate-message {
        display: flex;
    }

    #intro {
        display: none;
    }

    #garden {
        display: none !important;
    }
}


/* =====================================================
   HORIZONTAL — IPHONE
===================================================== */

@media
(orientation: landscape)
and (max-height: 500px) {

    .sunflower-button {
        width: 175px;
        height: 175px;
    }


    .petal {
        width: 50px;
        height: 80px;

        margin-left: -25px;
        margin-top: -40px;
    }


    .p1 { transform: rotate(0deg) translateY(-40px); }
    .p2 { transform: rotate(45deg) translateY(-40px); }
    .p3 { transform: rotate(90deg) translateY(-40px); }
    .p4 { transform: rotate(135deg) translateY(-40px); }
    .p5 { transform: rotate(180deg) translateY(-40px); }
    .p6 { transform: rotate(225deg) translateY(-40px); }
    .p7 { transform: rotate(270deg) translateY(-40px); }
    .p8 { transform: rotate(315deg) translateY(-40px); }


    .flower-center {
        width: 65px;
        height: 65px;

        left: 50%;
        top: 50%;

        transform:
            translate(-50%, -50%);
    }


    .instruction {
        font-size: 16px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     AVISO PARA GIRAR
===================================================== -->

<section id="rotate-message">

    <div class="rotate-content">

        <div class="rotate-icon">
            📱
        </div>

        <h2>
            Gira tu teléfono
        </h2>

        <p>
            Esta pequeña historia está hecha
            para disfrutarse en horizontal. 🌻
        </p>

    </div>

</section>


<!-- =====================================================
     ESCENA INICIAL
===================================================== -->

<main id="intro">

    <div class="intro-content">

        <button
            id="sunflowerButton"
            class="sunflower-button"
            aria-label="Presiona el girasol">

            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="petal p6"></span>
            <span class="petal p7"></span>
            <span class="petal p8"></span>

            <span class="flower-center"></span>

            <span
                id="ripple"
                class="ripple">
            </span>

        </button>


        <div class="instruction">
            Presiona aquí
        </div>

    </div>

</main>


<!-- =====================================================
     JARDÍN
===================================================== -->

<section id="garden">

    <div class="sky"></div>

    <div class="sun-glow"></div>

    <div class="soil"></div>

    <div class="grass"></div>

    <div class="sprout"></div>


    <!-- Campo contenido -->

    <div
        id="sunflowerField"
        class="sunflower-field">
    </div>


    <!-- Tendedero -->

    <div class="clothesline">

        <div class="line-post left"></div>

        <div class="line-post right"></div>

        <div class="rope"></div>

    </div>


    <!-- Texto -->

    <div class="garden-message">

        <h1>
            Un pequeño jardín para ti 🌻
        </h1>

        <p>
            Hay algunos recuerdos escondidos
            entre estas flores...
        </p>

    </div>

</section>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const intro =
    document.getElementById("intro");

const garden =
    document.getElementById("garden");

const sunflowerButton =
    document.getElementById("sunflowerButton");

const ripple =
    document.getElementById("ripple");


let started = false;


/* =====================================================
   INICIO
===================================================== */

sunflowerButton.addEventListener(
    "click",
    startExperience
);


function startExperience() {

    if (started) {
        return;
    }

    started = true;


    /* -----------------------------------------------
       ONDA
    ----------------------------------------------- */

    ripple.classList.remove("active");

    void ripple.offsetWidth;

    ripple.classList.add("active");


    /* -----------------------------------------------
       DESAPARECE GIRASOL
    ----------------------------------------------- */

    setTimeout(() => {

        sunflowerButton.style.transform =
            "scale(.7)";

        sunflowerButton.style.opacity =
            "0";

    }, 450);


    /* -----------------------------------------------
       CAMBIAMOS AL JARDÍN
    ----------------------------------------------- */

    setTimeout(() => {

        intro.style.opacity = "0";

        setTimeout(() => {

            intro.style.display = "none";

            garden.style.display = "block";

            requestAnimationFrame(() => {

                garden.style.opacity = "1";

            });

        }, 1000);

    }, 1200);


    /* -----------------------------------------------
       TIERRA
    ----------------------------------------------- */

    setTimeout(() => {

        garden.classList.add(
            "grow-soil"
        );

    }, 1900);


    /* -----------------------------------------------
       BROTE
    ----------------------------------------------- */

    setTimeout(() => {

        garden.classList.add(
            "grow-sprout"
        );

    }, 3300);


    /* -----------------------------------------------
       PASTO
    ----------------------------------------------- */

    setTimeout(() => {

        garden.classList.add(
            "grow-grass"
        );

    }, 4500);


    /* -----------------------------------------------
       GIRASOLES
    ----------------------------------------------- */

    setTimeout(() => {

        createFieldFlowers();

        garden.classList.add(
            "show-field"
        );

    }, 6500);


    /* -----------------------------------------------
       TENDEDERO
    ----------------------------------------------- */

    setTimeout(() => {

        garden.classList.add(
            "show-line"
        );

    }, 7600);


    /* -----------------------------------------------
       MENSAJE
    ----------------------------------------------- */

    setTimeout(() => {

        garden.classList.add(
            "show-message"
        );

    }, 8500);

}


/* =====================================================
   CREAR GIRASOLES
===================================================== */

function createFieldFlowers() {

    const field =
        document.getElementById(
            "sunflowerField"
        );


    /*
       IMPORTANTE:

       Estos valores están dentro
       de la zona inferior del campo.

       Ninguna flor debe invadir
       el área del tendedero.
    */

    const positions = [

        /* FILA TRASERA */

        [6, 56],
        [18, 62],
        [30, 54],
        [42, 64],
        [54, 55],
        [66, 63],
        [78, 54],
        [90, 62],


        /* FILA MEDIA */

        [2, 34],
        [14, 40],
        [26, 31],
        [38, 43],
        [50, 33],
        [62, 42],
        [74, 32],
        [86, 41],
        [96, 33],


        /* FILA DELANTERA */

        [8, 8],
        [22, 14],
        [36, 7],
        [50, 16],
        [64, 8],
        [78, 15],
        [92, 7]

    ];


    positions.forEach(
        (position, index) => {

            const flower =
                document.createElement(
                    "div"
                );


            flower.className =
                "field-flower";


            flower.style.left =
                position[0] + "%";


            flower.style.bottom =
                position[1] + "%";


            flower.style.animationDelay =
                (index * 0.08) + "s";


            flower.innerHTML = `

                <div
                    class="field-stem">
                </div>

                <div
                    class="field-leaf left">
                </div>

                <div
                    class="field-leaf right">
                </div>


                <div class="field-head">

                    <span
                        class="field-petal fp1">
                    </span>

                    <span
                        class="field-petal fp2">
                    </span>

                    <span
                        class="field-petal fp3">
                    </span>

                    <span
                        class="field-petal fp4">
                    </span>

                    <span
                        class="field-petal fp5">
                    </span>

                    <span
                        class="field-petal fp6">
                    </span>

                    <span
                        class="field-petal fp7">
                    </span>

                    <span
                        class="field-petal fp8">
                    </span>

                    <span
                        class="field-center">
                    </span>

                </div>
            `;


            field.appendChild(
                flower
            );

        }
    );

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Para ti 🌻</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#f8f0df;
}

body{
    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* =====================================================
   PANTALLA GIRAR TELÉFONO
===================================================== */

#rotate-screen{

    position:fixed;

    inset:0;

    background:#f8f0df;

    z-index:1000;

    display:none;

    align-items:center;
    justify-content:center;

    text-align:center;

    color:#725d45;
}

.rotate-content{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:18px;
}

.phone-icon{

    width:48px;
    height:82px;

    border:3px solid #725d45;

    border-radius:9px;

    position:relative;

    animation:
        rotatePhone
        2.2s
        ease-in-out
        infinite;
}

.phone-icon::after{

    content:"";

    position:absolute;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#725d45;

    bottom:5px;

    left:50%;

    transform:
        translateX(-50%);
}

.rotate-content p{

    font-size:20px;

    font-style:italic;
}

@keyframes rotatePhone{

    0%,100%{
        transform:rotate(0deg);
    }

    40%,60%{
        transform:rotate(90deg);
    }

}

@media (orientation:portrait){

    #rotate-screen{
        display:flex;
    }

}


/* =====================================================
   INTRO
===================================================== */

#intro{

    position:fixed;

    inset:0;

    background:#f8f0df;

    z-index:500;

    display:flex;

    align-items:center;
    justify-content:center;

    transition:
        opacity
        1.2s
        ease;
}

.intro-content{

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.intro-flower{

    position:relative;

    width:125px;
    height:125px;

    animation:
        floatFlower
        3s
        ease-in-out
        infinite;
}

@keyframes floatFlower{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}

.petal{

    position:absolute;

    width:42px;
    height:64px;

    background:#e8a52e;

    border-radius:
        50%
        50%
        45%
        45%;

    left:50%;
    top:50%;

    transform-origin:
        50%
        100%;
}

.p1{
    transform:
        translate(-50%,-100%)
        rotate(0deg);
}

.p2{
    transform:
        translate(-50%,-100%)
        rotate(45deg);
}

.p3{
    transform:
        translate(-50%,-100%)
        rotate(90deg);
}

.p4{
    transform:
        translate(-50%,-100%)
        rotate(135deg);
}

.p5{
    transform:
        translate(-50%,-100%)
        rotate(180deg);
}

.p6{
    transform:
        translate(-50%,-100%)
        rotate(225deg);
}

.p7{
    transform:
        translate(-50%,-100%)
        rotate(270deg);
}

.p8{
    transform:
        translate(-50%,-100%)
        rotate(315deg);
}

.flower-center{

    position:absolute;

    width:48px;
    height:48px;

    border-radius:50%;

    background:#75451e;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    box-shadow:
        inset
        0 0 0 5px
        #5b361b;
}

.intro-text{

    margin-top:28px;

    color:#765f47;

    font-size:20px;

    font-style:italic;

    animation:
        softPulse
        2.5s
        ease-in-out
        infinite;
}

@keyframes softPulse{

    0%,100%{
        opacity:.65;
    }

    50%{
        opacity:1;
    }

}


/* =====================================================
   FRASES INICIALES
===================================================== */

#messages{

    position:fixed;

    inset:0;

    z-index:450;

    background:#f8f0df;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px;

    pointer-events:none;
}

.message{

    position:absolute;

    max-width:720px;

    color:#6f5a43;

    font-size:
        clamp(
            25px,
            4vw,
            42px
        );

    line-height:1.45;

    font-style:italic;

    opacity:0;

    transition:
        opacity
        1.4s
        ease;
}

.message.show{
    opacity:1;
}


/* =====================================================
   JARDÍN
===================================================== */

#garden{

    position:fixed;

    inset:0;

    overflow:hidden;

    background:
        linear-gradient(
            to bottom,
            #a9ddea 0%,
            #bce4e2 37%,
            #dce7d1 49%,
            #8fbd58 50%,
            #65a844 100%
        );

    opacity:0;

    transition:
        opacity
        1.5s
        ease;
}

#garden.show{
    opacity:1;
}


/* =====================================================
   SOL
===================================================== */

.sun{

    position:absolute;

    width:95px;
    height:95px;

    right:8%;
    top:7%;

    border-radius:50%;

    background:#ffd66b;

    box-shadow:
        0 0 35px
        rgba(255,214,107,.55),

        0 0 70px
        rgba(255,214,107,.25);
}


/* =====================================================
   PASTO
===================================================== */

.grass{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:52%;

    background:
        linear-gradient(
            to bottom,
            #8fbd58 0%,
            #78b24d 35%,
            #65a844 100%
        );

    z-index:2;
}

.grass::before{

    content:"";

    position:absolute;

    inset:0;

    background:

        radial-gradient(
            ellipse at 20% 20%,
            rgba(255,255,255,.08),
            transparent 40%
        ),

        radial-gradient(
            ellipse at 75% 30%,
            rgba(255,255,255,.06),
            transparent 40%
        );
}


/* =====================================================
   TENDEDERO
===================================================== */

.clothesline{

    position:absolute;

    left:4%;
    right:4%;

    top:16%;

    height:2px;

    background:#72533c;

    z-index:5;
}

.post{

    position:absolute;

    width:8px;
    height:170px;

    background:#76553d;

    top:-10px;

    border-radius:4px;
}

.post.left{
    left:0;
}

.post.right{
    right:0;
}

.rope{

    position:absolute;

    left:0;
    right:0;

    top:0;

    height:3px;

    background:#76553d;
}


/* =====================================================
   CAMPO
===================================================== */

.sunflower-field{

    position:absolute;

    left:2%;
    right:2%;

    top:49%;

    height:51%;

    overflow:visible;

    z-index:10;
}


/* =====================================================
   GIRASOLES
===================================================== */

.field-flower{

    position:absolute;

    width:190px;
    height:190px;

    transform:
        translate(-50%,-50%)
        scale(var(--scale))
        rotate(var(--rotate));

    transform-origin:center center;

    cursor:pointer;

    z-index:var(--z);

    transition:
        transform
        .35s
        ease,

        filter
        .35s
        ease;
}

.field-flower:hover{

    filter:
        brightness(1.08);
}

.field-flower .petal{

    width:38px;
    height:62px;

    background:#e8a52e;
}

.field-flower .flower-center{

    width:46px;
    height:46px;
}


/* =====================================================
   GLOW DE ESPECIALES
===================================================== */

.field-flower.special::after{

    content:"";

    position:absolute;

    width:72px;
    height:72px;

    left:50%;

    top:
        calc(
            50% +
            var(--head-offset)
        );

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,221,91,.30) 0%,
            rgba(255,221,91,.12) 35%,
            rgba(255,221,91,0) 70%
        );

    opacity:.25;

    animation:
        subtleGlow
        3.2s
        ease-in-out
        infinite;

    pointer-events:none;

    z-index:10;
}

@keyframes subtleGlow{

    0%,100%{

        opacity:.12;

        transform:
            translate(-50%,-50%)
            scale(.88);
    }

    50%{

        opacity:.45;

        transform:
            translate(-50%,-50%)
            scale(1.08);
    }

}


/* =====================================================
   ZONA INVISIBLE DE CLIC
   DE LAS FLORES ESPECIALES
===================================================== */

.special-hit{

    position:absolute;

    width:100px;
    height:100px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:transparent;

    cursor:pointer;

    z-index:999;

    pointer-events:auto;
}


/* =====================================================
   MENSAJE DE FLOR
===================================================== */

.flower-message{

    position:fixed;

    inset:0;

    z-index:400;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        rgba(
            71,
            55,
            38,
            .28
        );

    backdrop-filter:
        blur(3px);

    opacity:0;

    visibility:hidden;

    transition:
        opacity
        .45s
        ease,

        visibility
        .45s
        ease;
}

.flower-message.show{

    opacity:1;

    visibility:visible;
}

.flower-card{

    width:
        min(
            520px,
            90vw
        );

    background:#fffaf0;

    border-radius:22px;

    padding:
        35px
        30px
        28px;

    text-align:center;

    box-shadow:
        0 15px 50px
        rgba(70,50,30,.25);

    transform:
        translateY(25px)
        scale(.92);

    transition:
        transform
        .45s
        ease;
}

.flower-message.show
.flower-card{

    transform:
        translateY(0)
        scale(1);
}

.card-flower{

    font-size:38px;

    margin-bottom:15px;
}

.flower-card p{

    color:#6e5b45;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(
            20px,
            3.5vw,
            29px
        );

    line-height:1.5;

    font-style:italic;
}

.close-message{

    margin-top:25px;

    border:none;

    background:#d89b32;

    color:white;

    padding:
        10px
        25px;

    border-radius:20px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:16px;

    cursor:pointer;
}


/* =====================================================
   SEMILLA
===================================================== */

.seed{

    position:fixed;

    width:9px;
    height:14px;

    background:#75451e;

    border-radius:
        50%
        50%
        45%
        45%;

    left:50%;
    top:45%;

    transform:
        translateX(-50%);

    z-index:480;

    opacity:0;

    pointer-events:none;
}

.seed.fall{

    animation:
        seedFall
        1.8s
        ease-in
        forwards;
}

@keyframes seedFall{

    0%{

        opacity:0;

        transform:
            translateX(-50%)
            translateY(-20px)
            rotate(0deg);
    }

    15%{
        opacity:1;
    }

    100%{

        opacity:1;

        transform:
            translateX(-50%)
            translateY(230px)
            rotate(220deg);
    }

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media
(max-width:700px)
and (orientation:landscape){

    .intro-flower{

        transform:
            scale(.75);
    }

    .intro-text{

        margin-top:5px;

        font-size:16px;
    }

    .sun{

        width:70px;
        height:70px;
    }

    .clothesline{

        top:12%;
    }

    .post{

        height:125px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     ROTAR
===================================================== -->

<div id="rotate-screen">

    <div class="rotate-content">

        <div class="phone-icon"></div>

        <p>
            Gira tu teléfono para continuar 🌻
        </p>

    </div>

</div>


<!-- =====================================================
     INTRO
===================================================== -->

<div id="intro">

    <div
        class="intro-content"
        id="introFlower"
    >

        <div class="intro-flower">

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="petal p6"></div>
            <div class="petal p7"></div>
            <div class="petal p8"></div>

            <div class="flower-center"></div>

        </div>

        <div class="intro-text">

            Presiona aquí

        </div>

    </div>

</div>


<!-- =====================================================
     FRASES
===================================================== -->

<div id="messages">

    <div class="message">

        A veces no puedo darte todo lo que quisiera...

    </div>


    <div class="message">

        pero siempre voy a encontrar una manera de
        recordarte lo mucho que te quiero.

    </div>


    <div class="message">

        Y esta vez, hice un pequeño lugar
        solamente para ti. 🌻

    </div>

</div>


<!-- =====================================================
     JARDÍN
===================================================== -->

<div id="garden">

    <div class="sun"></div>

    <div class="grass"></div>


    <!-- TENDEDERO -->

    <div class="clothesline">

        <div class="post left"></div>

        <div class="post right"></div>

        <div class="rope"></div>

    </div>


    <!-- CAMPO -->

    <div
        class="sunflower-field"
        id="sunflowerField"
    ></div>

</div>


<!-- =====================================================
     SEMILLA
===================================================== -->

<div
    class="seed"
    id="seed"
></div>


<!-- =====================================================
     MENSAJE
===================================================== -->

<div
    class="flower-message"
    id="flowerMessage"
>

    <div class="flower-card">

        <div class="card-flower">

            🌻

        </div>

        <p id="flowerMessageText"></p>

        <button
            class="close-message"
            id="closeMessage"
        >

            Cerrar

        </button>

    </div>

</div>


<script>


/* =====================================================
   ELEMENTOS
===================================================== */

const intro =
    document.getElementById(
        "intro"
    );

const introFlower =
    document.getElementById(
        "introFlower"
    );

const messages =
    document.getElementById(
        "messages"
    );

const messageElements =
    document.querySelectorAll(
        ".message"
    );

const garden =
    document.getElementById(
        "garden"
    );

const seed =
    document.getElementById(
        "seed"
    );

const sunflowerField =
    document.getElementById(
        "sunflowerField"
    );

const flowerMessage =
    document.getElementById(
        "flowerMessage"
    );

const flowerMessageText =
    document.getElementById(
        "flowerMessageText"
    );

const closeMessage =
    document.getElementById(
        "closeMessage"
    );


/* =====================================================
   CONFIGURACIÓN DE FLORES
===================================================== */

const flowers = [


    /* =================================================
       ZONA SUPERIOR
    ================================================= */


    {
        left:"3%",
        top:"6%",
        scale:.40,
        rotate:"-4deg",
        headOffset:"8px"
    },


    {
        left:"15%",
        top:"31%",
        scale:.45,
        rotate:"2deg",
        headOffset:"-12px"
    },


    {
        left:"28%",
        top:"13%",
        scale:.39,
        rotate:"-2deg",
        headOffset:"15px"
    },


    {
        left:"42%",
        top:"40%",
        scale:.46,
        rotate:"3deg",
        headOffset:"-18px"
    },


    /* =================================================
       🌻 ESPECIAL 1
    ================================================= */

    {
        left:"55%",
        top:"7%",
        scale:.42,
        rotate:"-3deg",
        headOffset:"7px",

        message:
        "Eres mi vida y por ello quiero estar a tu lado mil y un vidas"
    },


    {
        left:"69%",
        top:"27%",
        scale:.45,
        rotate:"2deg",
        headOffset:"-16px"
    },


    {
        left:"83%",
        top:"12%",
        scale:.40,
        rotate:"-2deg",
        headOffset:"12px"
    },


    {
        left:"96%",
        top:"38%",
        scale:.47,
        rotate:"3deg",
        headOffset:"-20px"
    },


    {
        left:"21%",
        top:"55%",
        scale:.41,
        rotate:"-3deg",
        headOffset:"9px"
    },


    {
        left:"91%",
        top:"60%",
        scale:.45,
        rotate:"2deg",
        headOffset:"-15px"
    },


    /* =================================================
       ZONA MEDIA
    ================================================= */


    {
        left:"5%",
        top:"70%",
        scale:.60,
        rotate:"-2deg",
        headOffset:"-8px"
    },


    {
        left:"18%",
        top:"84%",
        scale:.66,
        rotate:"2deg",
        headOffset:"-24px"
    },


    {
        left:"33%",
        top:"62%",
        scale:.59,
        rotate:"-1deg",
        headOffset:"7px"
    },


    {
        left:"47%",
        top:"76%",
        scale:.69,
        rotate:"2deg",
        headOffset:"-28px"
    },


    {
        left:"61%",
        top:"54%",
        scale:.61,
        rotate:"-2deg",
        headOffset:"10px"
    },


    /* =================================================
       🌻 ESPECIAL 2
    ================================================= */

    {
        left:"75%",
        top:"72%",
        scale:.67,
        rotate:"1deg",
        headOffset:"-22px",

        message:
        "Esta aventura que estamos emprendiendo me alegra de que sea a tu lado"
    },


    {
        left:"87%",
        top:"51%",
        scale:.60,
        rotate:"-1deg",
        headOffset:"6px"
    },


    {
        left:"98%",
        top:"82%",
        scale:.69,
        rotate:"2deg",
        headOffset:"-26px"
    },


    {
        left:"37%",
        top:"91%",
        scale:.61,
        rotate:"-2deg",
        headOffset:"8px"
    },


    /* =================================================
       FLORES DELANTERAS
    ================================================= */


    {
        left:"2%",
        top:"47%",
        scale:.84,
        rotate:"-2deg",
        headOffset:"-20px"
    },


    {
        left:"12%",
        top:"64%",
        scale:.91,
        rotate:"2deg",
        headOffset:"-35px"
    },


    {
        left:"30%",
        top:"78%",
        scale:.82,
        rotate:"-1deg",
        headOffset:"5px"
    },


    {
        left:"44%",
        top:"58%",
        scale:.92,
        rotate:"1deg",
        headOffset:"-40px"
    },


    {
        left:"59%",
        top:"88%",
        scale:.85,
        rotate:"-2deg",
        headOffset:"-10px"
    },


    {
        left:"73%",
        top:"59%",
        scale:.92,
        rotate:"2deg",
        headOffset:"-30px"
    },


    {
        left:"88%",
        top:"77%",
        scale:.84,
        rotate:"-2deg",
        headOffset:"8px"
    },


    {
        left:"98%",
        top:"67%",
        scale:.88,
        rotate:"2deg",
        headOffset:"-25px"
    }

];


/* =====================================================
   CREAR GIRASOLES
===================================================== */

flowers.forEach(
    (flower,index)=>{


        /* ---------------------------------------------
           CONTENEDOR
        --------------------------------------------- */

        const flowerElement =
            document.createElement(
                "div"
            );

        flowerElement.className =
            "field-flower";


        flowerElement.style.left =
            flower.left;

        flowerElement.style.top =
            flower.top;


        flowerElement.style.setProperty(
            "--scale",
            flower.scale
        );

        flowerElement.style.setProperty(
            "--rotate",
            flower.rotate
        );

        flowerElement.style.setProperty(
            "--head-offset",
            flower.headOffset
        );


        /* ---------------------------------------------
           PROFUNDIDAD
        --------------------------------------------- */

        let depth;

        if(index < 10){

            depth = 7;

        }
        else if(index < 19){

            depth = 10;

        }
        else{

            depth = 18;

        }

        flowerElement.style.zIndex =
            depth;


        /* ---------------------------------------------
           PÉTALOS
        --------------------------------------------- */

        for(
            let i = 0;
            i < 8;
            i++
        ){

            const petal =
                document.createElement(
                    "div"
                );

            petal.className =
                "petal";


            petal.style.transform =
                `
                translate(-50%,-100%)
                rotate(${i * 45}deg)
                `;


            flowerElement.appendChild(
                petal
            );

        }


        /* ---------------------------------------------
           CENTRO
        --------------------------------------------- */

        const center =
            document.createElement(
                "div"
            );

        center.className =
            "flower-center";


        flowerElement.appendChild(
            center
        );


        /* ---------------------------------------------
           AGREGAR AL CAMPO
        --------------------------------------------- */

        sunflowerField.appendChild(
            flowerElement
        );


        /* =================================================
           FLOR ESPECIAL
        ================================================= */

        if(flower.message){


            flowerElement.classList.add(
                "special"
            );


            /* -----------------------------------------
               ZONA INVISIBLE DE TOQUE
            ----------------------------------------- */

            const specialHit =
                document.createElement(
                    "div"
                );

            specialHit.className =
                "special-hit";


            specialHit.style.left =
                flower.left;


            specialHit.style.top =
                `calc(
                    ${flower.top}
                    +
                    ${flower.headOffset}
                )`;


            /* -----------------------------------------
               GUARDAMOS MENSAJE
            ----------------------------------------- */

            specialHit.dataset.message =
                flower.message;


            /* -----------------------------------------
               CLICK
            ----------------------------------------- */

            specialHit.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();


                    const text =
                        this.dataset.message;


                    flowerMessageText.textContent =
                        text;


                    flowerMessage.classList.add(
                        "show"
                    );

                }
            );


            /* -----------------------------------------
               PONER ZONA SOBRE TODO
            ----------------------------------------- */

            sunflowerField.appendChild(
                specialHit
            );

        }

    }
);


/* =====================================================
   CERRAR MENSAJE
===================================================== */

closeMessage.addEventListener(
    "click",
    function(){

        flowerMessage.classList.remove(
            "show"
        );

    }
);


/* =====================================================
   CERRAR TOCANDO AFUERA
===================================================== */

flowerMessage.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            flowerMessage
        ){

            flowerMessage.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   INICIAR EXPERIENCIA
===================================================== */

introFlower.addEventListener(
    "click",
    function(){


        intro.style.opacity =
            "0";


        setTimeout(
            function(){


                intro.style.display =
                    "none";


                seed.classList.add(
                    "fall"
                );


                messages.style.pointerEvents =
                    "auto";


                playMessages();


            },
            1000
        );

    }
);


/* =====================================================
   SECUENCIA DE FRASES
===================================================== */

function playMessages(){

    let current = 0;


    function showNext(){


        /* ---------------------------------------------
           OCULTAR ANTERIOR
        --------------------------------------------- */

        if(current > 0){

            messageElements[
                current - 1
            ].classList.remove(
                "show"
            );

        }


        /* ---------------------------------------------
           TERMINAR
        --------------------------------------------- */

        if(
            current >=
            messageElements.length
        ){

            setTimeout(
                function(){


                    messages.style.opacity =
                        "0";


                    setTimeout(
                        function(){


                            messages.style.display =
                                "none";


                            messages.style.pointerEvents =
                                "none";


                            garden.classList.add(
                                "show"
                            );


                        },
                        1200
                    );


                },
                1200
            );


            return;
        }


        /* ---------------------------------------------
           MOSTRAR ACTUAL
        --------------------------------------------- */

        messageElements[
            current
        ].classList.add(
            "show"
        );


        current++;


        setTimeout(
            showNext,
            3200
        );

    }


    showNext();

}

</script>

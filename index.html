<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Para ti 🌻</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

/* Fuente bonita recuperada */
body{
    font-family:
        "Georgia",
        "Times New Roman",
        serif;
}


/* =====================================================
   INTRO
===================================================== */

#intro{
    position:fixed;
    inset:0;

    background:#f8f0df;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:100;

    transition:opacity 1.2s ease;
}

.intro-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.tap-text{
    margin-top:30px;

    color:#705d47;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:17px;

    letter-spacing:1.5px;

    animation:pulseText 2s infinite;
}

@keyframes pulseText{

    0%,100%{
        opacity:.45;
    }

    50%{
        opacity:1;
    }
}


/* =====================================================
   GIRASOL INICIAL
===================================================== */

.big-sunflower{
    position:relative;

    width:190px;
    height:190px;

    cursor:pointer;

    animation:floatFlower 3s ease-in-out infinite;
}

@keyframes floatFlower{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}

.flower-center{
    position:absolute;

    width:70px;
    height:70px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:#6d3e08;

    border-radius:50%;

    z-index:5;

    box-shadow:
        inset 0 0 0 8px #81500d;
}

.petal{
    position:absolute;

    width:55px;
    height:85px;

    background:#ffd84f;

    border-radius:50%;

    left:50%;
    top:50%;

    transform-origin:center bottom;
}

.p1{
    transform:translate(-50%,-100%) rotate(0deg);
}

.p2{
    transform:translate(-50%,-100%) rotate(45deg);
}

.p3{
    transform:translate(-50%,-100%) rotate(90deg);
}

.p4{
    transform:translate(-50%,-100%) rotate(135deg);
}

.p5{
    transform:translate(-50%,-100%) rotate(180deg);
}

.p6{
    transform:translate(-50%,-100%) rotate(225deg);
}

.p7{
    transform:translate(-50%,-100%) rotate(270deg);
}

.p8{
    transform:translate(-50%,-100%) rotate(315deg);
}


/* =====================================================
   RIPPLE
===================================================== */

.ripple{
    position:absolute;

    width:30px;
    height:30px;

    border:2px solid rgba(214,170,55,.7);

    border-radius:50%;

    pointer-events:none;

    transform:translate(-50%,-50%);

    animation:rippleAnimation 1s ease-out forwards;
}

@keyframes rippleAnimation{

    from{
        width:30px;
        height:30px;
        opacity:1;
    }

    to{
        width:500px;
        height:500px;
        opacity:0;
    }
}


/* =====================================================
   SEMILLA
===================================================== */

.seed{
    position:fixed;

    width:14px;
    height:22px;

    background:#6c4317;

    border-radius:60% 40% 60% 40%;

    left:50%;
    top:35%;

    opacity:0;

    z-index:95;

    transform:rotate(25deg);
}

.seed.fall{
    animation:seedFall 2.5s ease-in forwards;
}

@keyframes seedFall{

    0%{
        opacity:0;
        transform:translate(-50%,0) rotate(25deg);
    }

    10%{
        opacity:1;
    }

    100%{
        opacity:1;
        transform:translate(-50%,420px) rotate(220deg);
    }
}


/* =====================================================
   MENSAJES
===================================================== */

#messages{
    position:fixed;
    inset:0;

    background:#f8f0df;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:90;

    opacity:0;

    pointer-events:none;

    transition:opacity 1s ease;
}

.message{

    position:absolute;

    width:82%;

    text-align:center;

    color:#65523b;

    /*
       Fuente elegante anterior
    */

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:25px;

    line-height:1.55;

    font-weight:400;

    font-style:italic;

    opacity:0;

    transform:translateY(12px);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.message.show{

    opacity:1;

    transform:translateY(0);
}

.message.hide{

    opacity:0;

    transform:translateY(-12px);
}


/* =====================================================
   JARDÍN
===================================================== */

#garden{

    position:fixed;

    inset:0;

    overflow:hidden;

    opacity:0;

    transition:opacity 1.5s ease;

    z-index:1;

    background:

        linear-gradient(
            to bottom,
            #a9ddea 0%,
            #bce4e2 37%,
            #dce7d1 49%,
            #8fbd58 50%,
            #65a844 100%
        );
}


/* =====================================================
   SOL
===================================================== */

.sun-glow{

    position:absolute;

    width:260px;
    height:260px;

    right:8%;
    top:7%;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(255,225,103,.7) 0%,
            rgba(255,225,103,.3) 38%,
            rgba(255,225,103,0) 72%
        );

    z-index:1;
}


/* =====================================================
   CÉSPED
===================================================== */

.grass{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:52%;

    background:

        linear-gradient(
            to bottom,
            #76ae48 0%,
            #5b9e3d 35%,
            #438b34 70%,
            #33772c 100%
        );

    z-index:2;
}

.grass::before{

    content:"";

    position:absolute;

    inset:0;

    background:

        repeating-linear-gradient(
            78deg,
            rgba(255,255,255,.055) 0px,
            rgba(255,255,255,.055) 2px,
            transparent 2px,
            transparent 17px
        );

    opacity:.8;
}


/* =====================================================
   CAMPO
===================================================== */

/*
   Ahora el campo ocupa todo el césped.
*/

.sunflower-field{

    position:absolute;

    left:2%;
    right:2%;

    top:49%;

    height:51%;

    overflow:visible;

    z-index:10;

    opacity:0;

    transform:translateY(35px);

    transition:
        opacity 1.6s ease,
        transform 1.6s ease;
}

#garden.ready .sunflower-field{

    opacity:1;

    transform:translateY(0);
}


/* =====================================================
   GIRASOL
===================================================== */

.field-flower{

    position:absolute;

    width:60px;
    height:180px;

    left:var(--left);

    /*
       AQUÍ está el cambio importante:
       cada flor tiene una altura distinta.
    */

    top:var(--top);

    transform:

        scale(var(--scale))

        rotate(var(--rotate));

    transform-origin:bottom center;

    z-index:var(--z);

    cursor:pointer;

    transition:
        transform .25s ease;
}

.field-flower:hover{

    transform:

        scale(calc(var(--scale) * 1.06))

        rotate(var(--rotate));
}


/* =====================================================
   TALLO
===================================================== */

.field-stem{

    position:absolute;

    width:7px;

    height:130px;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    background:

        linear-gradient(
            to right,
            #2c6d2c,
            #4c9639,
            #2d702d
        );

    border-radius:8px;

    z-index:1;
}


/* =====================================================
   HOJAS
===================================================== */

.leaf{

    position:absolute;

    width:55px;
    height:27px;

    background:

        linear-gradient(
            135deg,
            #4f9639,
            #2f7330
        );

    border-radius:
        100% 0 100% 0;

    z-index:2;
}

.leaf.left{

    left:-3px;

    bottom:48px;

    transform:rotate(-30deg);
}

.leaf.right{

    right:-5px;

    bottom:72px;

    transform:
        rotate(25deg)
        scaleX(-1);
}


/* =====================================================
   CABEZA
===================================================== */

.field-head{

    position:absolute;

    width:60px;
    height:60px;

    left:50%;
    top:0;

    transform:translateX(-50%);

    z-index:5;
}

.field-petal{

    position:absolute;

    width:29px;
    height:43px;

    left:50%;
    top:50%;

    background:

        linear-gradient(
            to bottom,
            #ffe36a,
            #ffd047
        );

    border-radius:50%;

    transform-origin:center bottom;
}

.fp1{
    transform:translate(-50%,-100%) rotate(0deg);
}

.fp2{
    transform:translate(-50%,-100%) rotate(45deg);
}

.fp3{
    transform:translate(-50%,-100%) rotate(90deg);
}

.fp4{
    transform:translate(-50%,-100%) rotate(135deg);
}

.fp5{
    transform:translate(-50%,-100%) rotate(180deg);
}

.fp6{
    transform:translate(-50%,-100%) rotate(225deg);
}

.fp7{
    transform:translate(-50%,-100%) rotate(270deg);
}

.fp8{
    transform:translate(-50%,-100%) rotate(315deg);
}

.field-center{

    position:absolute;

    width:25px;
    height:25px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:

        radial-gradient(
            circle,
            #5b3205 0%,
            #70420a 65%,
            #8b5b15 100%
        );

    border-radius:50%;

    z-index:10;
}


/* =====================================================
   TENDEDero
===================================================== */

.clothesline{

    position:absolute;

    top:7%;

    left:7%;

    width:86%;

    height:190px;

    /*
       IMPORTANTE:
       queda detrás de las flores.
    */

    z-index:5;

    opacity:0;

    transform:translateY(-20px);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

#garden.ready .clothesline{

    opacity:1;

    transform:translateY(0);
}

.clothesline-rope{

    position:absolute;

    top:30px;

    left:2%;

    width:96%;

    height:3px;

    background:#6b4523;

    border-radius:5px;

    z-index:6;
}

.clothesline-post{

    position:absolute;

    top:0;

    width:15px;

    height:185px;

    background:

        linear-gradient(
            to right,
            #603b1d,
            #795025,
            #603b1d
        );

    border-radius:10px;

    z-index:6;
}

.clothesline-post.left{
    left:0;
}

.clothesline-post.right{
    right:0;
}


/* =====================================================
   TELÉFONO GIRANDO
===================================================== */

.rotate-screen{

    position:fixed;

    inset:0;

    background:#f8f0df;

    z-index:200;

    display:none;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    text-align:center;
}

.phone-animation{

    width:55px;

    height:95px;

    border:3px solid #6e5b45;

    border-radius:12px;

    position:relative;

    animation:
        phoneRotate 2.5s ease-in-out infinite;
}

.phone-animation::before{

    content:"";

    position:absolute;

    width:20px;

    height:3px;

    border-radius:5px;

    background:#6e5b45;

    top:7px;

    left:50%;

    transform:translateX(-50%);
}

.phone-animation::after{

    content:"";

    position:absolute;

    width:7px;

    height:7px;

    border-radius:50%;

    background:#6e5b45;

    bottom:7px;

    left:50%;

    transform:translateX(-50%);
}

.rotate-text{

    margin-top:22px;

    color:#6e5b45;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:18px;

    font-style:italic;
}

@keyframes phoneRotate{

    0%{
        transform:rotate(0deg);
    }

    35%{
        transform:rotate(90deg);
    }

    65%{
        transform:rotate(90deg);
    }

    100%{
        transform:rotate(0deg);
    }
}


/* =====================================================
   IPHONE HORIZONTAL
===================================================== */

@media
(orientation:landscape)
and (max-height:500px){

    .big-sunflower{

        width:175px;
        height:175px;
    }

    .petal{

        width:50px;
        height:78px;
    }

    .flower-center{

        width:65px;
        height:65px;
    }

    .tap-text{

        margin-top:22px;

        font-size:14px;
    }

    .message{

        font-size:20px;

        width:80%;
    }

    .field-flower{

        width:52px;

        height:155px;
    }

    .field-head{

        width:52px;
        height:52px;
    }

    .field-petal{

        width:25px;
        height:38px;
    }

    .field-center{

        width:22px;
        height:22px;
    }

    .field-stem{

        height:110px;

        width:6px;
    }

    .leaf{

        width:47px;

        height:23px;
    }

    .clothesline{

        top:7%;

        height:150px;
    }

    .clothesline-post{

        height:160px;

        width:14px;
    }

    .clothesline-rope{

        top:28px;
    }
}


/* =====================================================
   VERTICAL
===================================================== */

@media
(orientation:portrait)
and (max-width:900px){

    #intro,
    #messages,
    #garden{

        display:none;
    }

    .rotate-screen{

        display:flex;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     PANTALLA PARA GIRAR TELÉFONO
===================================================== -->

<div class="rotate-screen">

    <div class="phone-animation"></div>

    <div class="rotate-text">
        Gira tu teléfono horizontalmente 🌻
    </div>

</div>


<!-- =====================================================
     INTRO
===================================================== -->

<section id="intro">

    <div class="intro-content">

        <div
            class="big-sunflower"
            id="startFlower"
        >

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="petal p6"></div>
            <div class="petal p7"></div>
            <div class="petal p8"></div>

            <div class="flower-center"></div>

        </div>

        <div class="tap-text">
            Presiona aquí
        </div>

    </div>

</section>


<!-- =====================================================
     SEMILLA
===================================================== -->

<div
    class="seed"
    id="seed">
</div>


<!-- =====================================================
     MENSAJES
===================================================== -->

<section id="messages">

    <div
        class="message"
        id="message1">

        A veces no hace falta tener mucho para demostrar cuánto quieres a alguien. 💛

    </div>

    <div
        class="message"
        id="message2">

        Y aunque esta vez no pude regalarte flores...

    </div>

    <div
        class="message"
        id="message3">

        Quise crear un pequeño lugar donde pudieras encontrar un pedacito de nosotros. 🌻

    </div>

</section>


<!-- =====================================================
     JARDÍN
===================================================== -->

<section id="garden">

    <div class="sun-glow"></div>

    <div class="grass"></div>

    <div
        class="sunflower-field"
        id="sunflowerField">
    </div>


    <!-- TENDEDero -->

    <div class="clothesline">

        <div class="clothesline-post left"></div>

        <div class="clothesline-rope"></div>

        <div class="clothesline-post right"></div>

    </div>

</section>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const startFlower =
document.getElementById("startFlower");

const intro =
document.getElementById("intro");

const seed =
document.getElementById("seed");

const messages =
document.getElementById("messages");

const garden =
document.getElementById("garden");

const field =
document.getElementById("sunflowerField");


/* =====================================================
   CREAR GIRASOL
===================================================== */

function createFlower(){

    const flower =
    document.createElement("div");

    flower.className =
    "field-flower";

    flower.innerHTML = `

        <div class="field-head">

            <div class="field-petal fp1"></div>
            <div class="field-petal fp2"></div>
            <div class="field-petal fp3"></div>
            <div class="field-petal fp4"></div>
            <div class="field-petal fp5"></div>
            <div class="field-petal fp6"></div>
            <div class="field-petal fp7"></div>
            <div class="field-petal fp8"></div>

            <div class="field-center"></div>

        </div>

        <div class="field-stem"></div>

        <div class="leaf left"></div>

        <div class="leaf right"></div>
    `;

    return flower;
}


/* =====================================================
   DISTRIBUCIÓN
===================================================== */

/*
   AHORA usamos TOP.

   Esto es diferente a las versiones anteriores.

   Algunas flores tienen la cabeza muy arriba,
   otras en medio y otras muy abajo.

   Esto crea profundidad visual REAL.
*/

const flowers = [

    /* =====================================
       FLORES MUY ATRÁS
    ===================================== */

    {
        left:"2%",
        top:"2%",
        scale:.50,
        rotate:"-3deg",
        z:7
    },

    {
        left:"13%",
        top:"15%",
        scale:.56,
        rotate:"2deg",
        z:7
    },

    {
        left:"25%",
        top:"5%",
        scale:.48,
        rotate:"-1deg",
        z:7
    },

    {
        left:"38%",
        top:"19%",
        scale:.55,
        rotate:"2deg",
        z:7
    },

    {
        left:"51%",
        top:"4%",
        scale:.50,
        rotate:"-2deg",
        z:7
    },

    {
        left:"64%",
        top:"16%",
        scale:.55,
        rotate:"1deg",
        z:7
    },

    {
        left:"77%",
        top:"6%",
        scale:.49,
        rotate:"-2deg",
        z:7
    },

    {
        left:"90%",
        top:"18%",
        scale:.54,
        rotate:"2deg",
        z:7
    },


    /* =====================================
       FLORES DEL MEDIO
    ===================================== */

    {
        left:"7%",
        top:"30%",
        scale:.72,
        rotate:"-2deg",
        z:10
    },

    {
        left:"19%",
        top:"39%",
        scale:.80,
        rotate:"2deg",
        z:11
    },

    {
        left:"31%",
        top:"27%",
        scale:.74,
        rotate:"-1deg",
        z:10
    },

    {
        left:"44%",
        top:"43%",
        scale:.84,
        rotate:"2deg",
        z:11
    },

    {
        left:"57%",
        top:"31%",
        scale:.73,
        rotate:"-2deg",
        z:10
    },

    {
        left:"69%",
        top:"42%",
        scale:.83,
        rotate:"1deg",
        z:11
    },

    {
        left:"81%",
        top:"29%",
        scale:.72,
        rotate:"-1deg",
        z:10
    },

    {
        left:"92%",
        top:"40%",
        scale:.80,
        rotate:"2deg",
        z:11
    },


    /* =====================================
       FLORES DELANTERAS
    ===================================== */

    {
        left:"3%",
        top:"53%",
        scale:1.00,
        rotate:"-2deg",
        z:18
    },

    {
        left:"17%",
        top:"66%",
        scale:1.08,
        rotate:"2deg",
        z:18
    },

    {
        left:"32%",
        top:"56%",
        scale:.98,
        rotate:"-1deg",
        z:18
    },

    {
        left:"47%",
        top:"70%",
        scale:1.10,
        rotate:"1deg",
        z:19
    },

    {
        left:"63%",
        top:"54%",
        scale:1.02,
        rotate:"-2deg",
        z:18
    },

    {
        left:"78%",
        top:"68%",
        scale:1.10,
        rotate:"2deg",
        z:19
    },

    {
        left:"93%",
        top:"55%",
        scale:1.00,
        rotate:"-2deg",
        z:18
    }

];


/* =====================================================
   CREAR FLORES
===================================================== */

function createFieldFlowers(){

    field.innerHTML="";

    flowers.forEach(
    (data,index)=>{

        const flower =
        createFlower();

        flower.style.setProperty(
            "--left",
            data.left
        );

        flower.style.setProperty(
            "--top",
            data.top
        );

        flower.style.setProperty(
            "--scale",
            data.scale
        );

        flower.style.setProperty(
            "--rotate",
            data.rotate
        );

        flower.style.setProperty(
            "--z",
            data.z
        );

        field.appendChild(flower);

    });

}


/* =====================================================
   INICIAR
===================================================== */

let started=false;

startFlower.addEventListener(
    "click",
    startExperience
);

startFlower.addEventListener(
    "touchstart",
    startExperience,
    {passive:true}
);


function startExperience(){

    if(started)
    return;

    started=true;


    /* RIPPLE */

    const ripple =
    document.createElement("div");

    ripple.className="ripple";

    ripple.style.left="50%";

    ripple.style.top="50%";

    startFlower.appendChild(ripple);


    /* GIRASOL */

    setTimeout(()=>{

        startFlower.style.transition=
        "opacity .8s ease, transform .8s ease";

        startFlower.style.opacity="0";

        startFlower.style.transform=
        "scale(.7)";

    },450);


    /* SEMILLA */

    setTimeout(()=>{

        seed.classList.add("fall");

    },800);


    /* INTRO */

    setTimeout(()=>{

        intro.style.opacity="0";

    },3300);


    /* MENSAJES */

    setTimeout(()=>{

        messages.style.opacity="1";

    },4200);


    /* MENSAJE 1 */

    setTimeout(()=>{

        document
        .getElementById("message1")
        .classList.add("show");

    },4600);


    setTimeout(()=>{

        document
        .getElementById("message1")
        .classList.remove("show");

        document
        .getElementById("message1")
        .classList.add("hide");

    },6800);


    /* MENSAJE 2 */

    setTimeout(()=>{

        document
        .getElementById("message2")
        .classList.add("show");

    },7600);


    setTimeout(()=>{

        document
        .getElementById("message2")
        .classList.remove("show");

        document
        .getElementById("message2")
        .classList.add("hide");

    },9800);


    /* MENSAJE 3 */

    setTimeout(()=>{

        document
        .getElementById("message3")
        .classList.add("show");

    },10600);


    setTimeout(()=>{

        document
        .getElementById("message3")
        .classList.remove("show");

        document
        .getElementById("message3")
        .classList.add("hide");

    },13200);


    /* PREPARAR JARDÍN */

    setTimeout(()=>{

        createFieldFlowers();

        messages.style.opacity="0";

    },13600);


    /* JARDÍN */

    setTimeout(()=>{

        garden.style.opacity="1";

        garden.classList.add("ready");

    },13800);

}


/* =====================================================
   CREAR FLORES
===================================================== */

createFieldFlowers();

</script>

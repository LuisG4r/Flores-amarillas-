<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Para ti 🌻</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#f8f0df;
}

/* =========================
   PANTALLA GIRAR TELÉFONO
========================= */

.rotate-screen{
    position:fixed;
    inset:0;
    background:#f8f0df;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}

.phone-animation{
    width:55px;
    height:95px;
    border:3px solid #6e5b45;
    border-radius:12px;
    position:relative;
    animation:phoneRotate 2.5s ease-in-out infinite;
}

.phone-animation::before{
    content:"";
    position:absolute;
    width:20px;
    height:3px;
    border-radius:5px;
    background:#6e5b45;
    top:7px;
    left:50%;
    transform:translateX(-50%);
}

.phone-animation::after{
    content:"";
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#6e5b45;
    bottom:7px;
    left:50%;
    transform:translateX(-50%);
}

.rotate-text{
    margin-top:22px;
    color:#6e5b45;
    font-family:Georgia,"Times New Roman",serif;
    font-size:18px;
    font-style:italic;
}

@keyframes phoneRotate{
    0%{
        transform:rotate(0deg);
    }

    35%{
        transform:rotate(90deg);
    }

    65%{
        transform:rotate(90deg);
    }

    100%{
        transform:rotate(0deg);
    }
}


/* =========================
   INTRO
========================= */

#intro{
    position:fixed;
    inset:0;
    background:#f8f0df;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    transition:opacity 1.5s ease;
}

.intro-flower{
    position:relative;
    width:170px;
    height:170px;
    cursor:pointer;
    animation:floatFlower 3s ease-in-out infinite;
}

@keyframes floatFlower{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}

.petal{
    position:absolute;
    width:58px;
    height:82px;
    background:#f5b72e;
    border-radius:50% 50% 45% 45%;
    left:50%;
    top:50%;
    transform-origin:50% 100%;
}

.petal:nth-child(1){
    transform:translate(-50%,-100%) rotate(0deg);
}

.petal:nth-child(2){
    transform:translate(-50%,-100%) rotate(45deg);
}

.petal:nth-child(3){
    transform:translate(-50%,-100%) rotate(90deg);
}

.petal:nth-child(4){
    transform:translate(-50%,-100%) rotate(135deg);
}

.petal:nth-child(5){
    transform:translate(-50%,-100%) rotate(180deg);
}

.petal:nth-child(6){
    transform:translate(-50%,-100%) rotate(225deg);
}

.petal:nth-child(7){
    transform:translate(-50%,-100%) rotate(270deg);
}

.petal:nth-child(8){
    transform:translate(-50%,-100%) rotate(315deg);
}

.flower-center{
    position:absolute;
    width:65px;
    height:65px;
    border-radius:50%;
    background:#65401f;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:5;
}

.flower-center::after{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    background:
        radial-gradient(circle,#2f1b0d 1.5px,transparent 2px);
    background-size:8px 8px;
}

.press-text{
    margin-top:30px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:19px;
    color:#6e5b45;
    font-style:italic;
}


/* =========================
   MENSAJES
========================= */

#messages{
    position:fixed;
    inset:0;
    background:#f8f0df;
    z-index:90;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    opacity:0;
    transition:opacity 1.2s ease;
}

.message{
    position:absolute;
    width:85%;
    color:#6e5b45;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(24px,4vw,42px);
    font-style:italic;
    line-height:1.5;
    opacity:0;
    transition:opacity 1.3s ease;
}


/* =========================
   JARDÍN
========================= */

#garden{
    position:fixed;
    inset:0;
    opacity:0;
    z-index:10;
    overflow:hidden;

    background:
        linear-gradient(
            to bottom,
            #a9ddea 0%,
            #bce4e2 37%,
            #dce7d1 49%,
            #8fbd58 50%,
            #65a844 100%
        );

    transition:opacity 2s ease;
}


/* =========================
   SOL
========================= */

.sun{
    position:absolute;
    width:115px;
    height:115px;
    border-radius:50%;
    background:#ffd75b;
    right:8%;
    top:9%;
    box-shadow:
        0 0 45px rgba(255,215,91,.45);
    z-index:1;
}


/* =========================
   NUBES
========================= */

.cloud{
    position:absolute;
    width:130px;
    height:35px;
    background:rgba(255,255,255,.55);
    border-radius:30px;
    z-index:2;
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    background:rgba(255,255,255,.55);
    border-radius:50%;
}

.cloud::before{
    width:55px;
    height:55px;
    left:20px;
    bottom:8px;
}

.cloud::after{
    width:70px;
    height:70px;
    right:15px;
    bottom:4px;
}

.cloud.one{
    left:9%;
    top:15%;
    transform:scale(.75);
}

.cloud.two{
    left:43%;
    top:10%;
    transform:scale(.55);
}


/* =========================
   PASTO
========================= */

.grass{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:52%;
    background:
        linear-gradient(
            to bottom,
            #8fbd58 0%,
            #76ad4a 30%,
            #65a844 65%,
            #57913a 100%
        );
    z-index:2;
}


/* =========================
   PEQUEÑOS DETALLES DEL PASTO
========================= */

.grass-blade{
    position:absolute;
    width:3px;
    height:18px;
    background:#477d32;
    border-radius:5px;
    bottom:0;
    transform-origin:bottom center;
    opacity:.65;
}

.grass-blade:nth-child(1){
    left:4%;
    transform:rotate(-12deg);
}

.grass-blade:nth-child(2){
    left:11%;
    height:25px;
    transform:rotate(15deg);
}

.grass-blade:nth-child(3){
    left:19%;
    height:16px;
    transform:rotate(-8deg);
}

.grass-blade:nth-child(4){
    left:27%;
    height:24px;
    transform:rotate(13deg);
}

.grass-blade:nth-child(5){
    left:36%;
    height:19px;
    transform:rotate(-15deg);
}

.grass-blade:nth-child(6){
    left:45%;
    height:26px;
    transform:rotate(10deg);
}

.grass-blade:nth-child(7){
    left:54%;
    height:18px;
    transform:rotate(-12deg);
}

.grass-blade:nth-child(8){
    left:64%;
    height:25px;
    transform:rotate(14deg);
}

.grass-blade:nth-child(9){
    left:73%;
    height:17px;
    transform:rotate(-10deg);
}

.grass-blade:nth-child(10){
    left:83%;
    height:24px;
    transform:rotate(12deg);
}

.grass-blade:nth-child(11){
    left:92%;
    height:19px;
    transform:rotate(-14deg);
}


/* =========================
   TENDEDERO
========================= */

.clothesline{
    position:absolute;
    top:7%;
    left:7%;
    width:86%;
    height:190px;
    z-index:5;
}

.clothesline-post{
    position:absolute;
    width:8px;
    height:185px;
    background:#806346;
    border-radius:8px;
    top:0;
    z-index:6;
}

.clothesline-post.left{
    left:0;
}

.clothesline-post.right{
    right:0;
}

.clothesline-rope{
    position:absolute;
    left:0;
    right:0;
    top:30px;
    height:4px;
    background:#806346;
    border-radius:5px;
    z-index:6;
}

.clothesline-rope::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:18px;
    height:2px;
    background:rgba(128,99,70,.4);
    transform:rotate(1deg);
}


/* =========================
   CAMPO DE GIRASOLES
========================= */

.sunflower-field{
    position:absolute;
    left:2%;
    right:2%;
    top:49%;
    height:51%;
    overflow:visible;
    z-index:10;
}


/* =========================
   GIRASOLES
   SIN TALLO
========================= */

.field-flower{
    position:absolute;
    width:60px;
    height:var(--flower-height);
    left:var(--left);
    top:var(--top);

    transform:
        scale(var(--scale))
        rotate(var(--rotate));

    transform-origin:bottom center;

    z-index:var(--z);

    cursor:pointer;

    transition:
        transform .35s ease,
        filter .35s ease;
}

.field-flower:hover{
    filter:brightness(1.08);
}


/* =========================
   CABEZA DEL GIRASOL
========================= */

.field-head{
    position:absolute;
    width:60px;
    height:60px;
    left:50%;
    top:var(--head-offset);
    transform:translateX(-50%);
    z-index:5;
}

.field-petal{
    position:absolute;
    width:22px;
    height:34px;
    background:#f4b72c;
    border-radius:50% 50% 45% 45%;
    left:50%;
    top:50%;
    transform-origin:50% 100%;
}

.field-petal:nth-child(1){
    transform:translate(-50%,-100%) rotate(0deg);
}

.field-petal:nth-child(2){
    transform:translate(-50%,-100%) rotate(45deg);
}

.field-petal:nth-child(3){
    transform:translate(-50%,-100%) rotate(90deg);
}

.field-petal:nth-child(4){
    transform:translate(-50%,-100%) rotate(135deg);
}

.field-petal:nth-child(5){
    transform:translate(-50%,-100%) rotate(180deg);
}

.field-petal:nth-child(6){
    transform:translate(-50%,-100%) rotate(225deg);
}

.field-petal:nth-child(7){
    transform:translate(-50%,-100%) rotate(270deg);
}

.field-petal:nth-child(8){
    transform:translate(-50%,-100%) rotate(315deg);
}

.field-center{
    position:absolute;
    width:28px;
    height:28px;
    border-radius:50%;
    background:#65401f;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:4;
}

.field-center::after{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:50%;
    background:
        radial-gradient(circle,#2f1b0d 1px,transparent 1.5px);
    background-size:5px 5px;
}


/* =========================
   FLORES TRASERAS
========================= */

.back{
    --flower-height:150px;
}


/* =========================
   FLORES MEDIAS
========================= */

.middle{
    --flower-height:170px;
}


/* =========================
   FLORES DELANTERAS
========================= */

.front{
    --flower-height:190px;
}


/* =========================
   EFECTO AL TOCAR
========================= */

.ripple{
    position:fixed;
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid rgba(255,190,40,.8);
    pointer-events:none;
    transform:translate(-50%,-50%) scale(0);
    animation:rippleEffect 1s ease-out forwards;
    z-index:500;
}

@keyframes rippleEffect{
    to{
        transform:translate(-50%,-50%) scale(12);
        opacity:0;
    }
}


/* =========================
   SEMILLA
========================= */

.seed{
    position:fixed;
    width:10px;
    height:15px;
    border-radius:50%;
    background:#6c431d;
    left:50%;
    top:50%;
    z-index:300;
    opacity:0;
    transform:translate(-50%,-50%);
}

.seed.fall{
    animation:seedFall 2.5s ease-in forwards;
}

@keyframes seedFall{
    0%{
        opacity:1;
        transform:translate(-50%,-50%) rotate(0deg);
    }

    100%{
        opacity:0;
        transform:translate(-50%,300px) rotate(180deg);
    }
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width:700px){

    .intro-flower{
        transform:scale(.85);
    }

    .press-text{
        font-size:17px;
    }

    .message{
        font-size:25px;
        width:88%;
    }

    .sun{
        width:80px;
        height:80px;
        right:7%;
    }

    .clothesline{
        left:5%;
        width:90%;
    }

    .field-head{
        width:54px;
        height:54px;
    }

    .field-petal{
        width:20px;
        height:31px;
    }

    .field-center{
        width:25px;
        height:25px;
    }
}


/* =========================
   SOLO VERTICAL
========================= */

@media (orientation:portrait){

    #intro,
    #messages,
    #garden{
        display:none;
    }

    .rotate-screen{
        display:flex;
    }
}

</style>
</head>


<body>


<!-- =========================
     PANTALLA GIRAR
========================= -->

<div class="rotate-screen">

    <div class="phone-animation"></div>

    <div class="rotate-text">
        Gira tu teléfono 🌻
    </div>

</div>



<!-- =========================
     INTRO
========================= -->

<section id="intro">

    <div class="intro-flower" id="introFlower">

        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>

        <div class="flower-center"></div>

    </div>

    <div class="press-text">
        Presiona aquí
    </div>

</section>



<!-- =========================
     MENSAJES
========================= -->

<section id="messages">

    <div class="message" id="message1">
        A veces no puedo darte todo lo que quisiera...
    </div>

    <div class="message" id="message2">
        pero siempre voy a encontrar una manera de recordarte lo mucho que te quiero.
    </div>

    <div class="message" id="message3">
        Y esta vez, hice un pequeño lugar solamente para ti. 🌻
    </div>

</section>



<!-- =========================
     JARDÍN
========================= -->

<section id="garden">

    <div class="sun"></div>

    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <div class="grass">

        <div class="grass-blade"></div>
        <div class="grass-blade"></div>
        <div class="grass-blade"></div>
        <div class="grass-blade"></div>
        <div class="grass-blade"></div>
        <div class="grass-blade"></div>
        <div class="grass-blade"></div>
        <div class="grass-blade"></div>
        <div class="grass-blade"></div>
        <div class="grass-blade"></div>
        <div class="grass-blade"></div>

    </div>



    <!-- =========================
         TENDEDERO
    ========================= -->

    <div class="clothesline">

        <div class="clothesline-post left"></div>
        <div class="clothesline-post right"></div>

        <div class="clothesline-rope"></div>

    </div>



    <!-- =========================
         GIRASOLES
    ========================= -->

    <div class="sunflower-field" id="sunflowerField"></div>

</section>



<div class="seed" id="seed"></div>



<script>

/* =========================
   ELEMENTOS
========================= */

const intro = document.getElementById("intro");
const introFlower = document.getElementById("introFlower");

const messages = document.getElementById("messages");

const message1 = document.getElementById("message1");
const message2 = document.getElementById("message2");
const message3 = document.getElementById("message3");

const garden = document.getElementById("garden");

const seed = document.getElementById("seed");

const sunflowerField =
    document.getElementById("sunflowerField");


/* =========================
   GIRASOLES
========================= */

const flowers = [

    /* ---------- ATRÁS ---------- */

    {
        left:"1%",

        scale:.52,
        rotate:"-3deg",
        headOffset:"5px",

    },

    {

    {

    },

    {

    },

    {
        left:"50%",

        z:7
    },

    {
        left:"63%",
        top:"15%",
        scale:.57,

        z:7
    },

    {
        left:"76%",
        top:"2%",
        scale:.49,
        rotate:"-2deg",
        headOffset:"15px",

        z:7
    },

    {
        left:"89%",

        scale:.55,
        rotate:"2deg",

        flowerHeight:"150px",
        z:7
    },


    /* ---------- MEDIAS ---------- */

    {
        left:"5%",

        rotate:"-2deg",
        headOffset:"-8px",

        z:10
    },

    {
        left:"17%",

        scale:.82,
        rotate:"2deg",
        headOffset:"-25px",

        z:11
    },

    {
        left:"29%",
        top:"25%",
        scale:.73,
        rotate:"-1deg",
        headOffset:"8px",
        flowerHeight:"170px",
        z:10
    },

    {
        left:"42%",
        top:"41%",
        scale:.85,
        rotate:"2deg",
        headOffset:"-30px",

        z:11
    },

    {
        left:"55%",

    {
        left:"68%",

    },

    {
        left:"81%",

        rotate:"-1deg",

    },

    {
        left:"92%",

    },


    /* ---------- DELANTE ---------- */

    {
        left:"2%",

        rotate:"-2deg",
        headOffset:"-20px",
        flowerHeight:"190px",
        z:18
    },

    {
        left:"17%",

        scale:1.08,

        z:18
    },

    {

        z:18
    },

    {
        left:"47%",

        scale:1.10,
        rotate:"1deg",
        headOffset:"-40px",
        flowerHeight:"190px",
        z:19
    },

    {
        left:"63%",
        top:"53%",
        scale:1.02,
        rotate:"-2deg",

        z:18
    },

    {
        left:"78%",

        scale:1.10,
        rotate:"2deg",
        headOffset:"-30px",
        flowerHeight:"190px",
        z:19
    },

    {
        left:"93%",
        top:"54%",
        scale:1.00,
        rotate:"-2deg",
        headOffset:"8px",
        flowerHeight:"190px",
        z:18
    }

];


/* =========================
   CREAR GIRASOLES
========================= */

flowers.forEach((flower,index)=>{

    const flowerElement =
        document.createElement("div");

    flowerElement.className =
        "field-flower";

    flowerElement.style.setProperty(
        "--left",
        flower.left
    );

    flowerElement.style.setProperty(
        "--top",
        flower.top
    );

    flowerElement.style.setProperty(
        "--scale",
        flower.scale
    );

    flowerElement.style.setProperty(
        "--rotate",
        flower.rotate
    );

    flowerElement.style.setProperty(
        "--head-offset",
        flower.headOffset
    );

    flowerElement.style.setProperty(
        "--flower-height",
        flower.flowerHeight
    );

    flowerElement.style.setProperty(
        "--z",
        flower.z
    );


    flowerElement.innerHTML = `

        <div class="field-head">

            <div class="field-petal"></div>
            <div class="field-petal"></div>
            <div class="field-petal"></div>
            <div class="field-petal"></div>
            <div class="field-petal"></div>
            <div class="field-petal"></div>
            <div class="field-petal"></div>
            <div class="field-petal"></div>

            <div class="field-center"></div>

        </div>

    `;


    sunflowerField.appendChild(
        flowerElement
    );

});



/* =========================
   TOCAR EL GIRASOL INICIAL
========================= */

introFlower.addEventListener("click",(event)=>{

    /* Ripple */

    const ripple =
        document.createElement("div");

    ripple.className="ripple";

    ripple.style.left =
        event.clientX+"px";

    ripple.style.top =
        event.clientY+"px";

    document.body.appendChild(ripple);


    setTimeout(()=>{
        ripple.remove();
    },1000);


    /* Semilla */

    seed.classList.add("fall");


    /* Desaparece intro */

    intro.style.opacity="0";


    setTimeout(()=>{

        intro.style.display="none";

        messages.style.opacity="1";

    },1500);


    /* =========================
       FRASES
    ========================= */

    setTimeout(()=>{

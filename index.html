<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<meta name="theme-color" content="#f4eddb">

<title>Para ti 🌻</title>

<style>

/* ==================================================
   CONFIGURACIÓN GENERAL
================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background: #f4eddb;
}


/* ==================================================
   PANTALLA PRINCIPAL
================================================== */

#intro {

    position: relative;

    width: 100vw;
    height: 100dvh;

    display: flex;

    justify-content: center;
    align-items: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #fbf7ec 0%,
            #f4eddb 65%,
            #eee2c9 100%
        );

    transition:
        opacity 1.2s ease;
}


/* ==================================================
   TEXTURA DE PAPEL
================================================== */

#intro::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: 0.18;

    background-image:
        radial-gradient(
            rgba(100, 75, 35, 0.18) 0.7px,
            transparent 0.7px
        );

    background-size: 5px 5px;
}


/* ==================================================
   CONTENIDO CENTRAL
================================================== */

.intro-content {

    position: relative;

    z-index: 5;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    transform: translateY(-3%);
}


/* ==================================================
   GIRASOL
================================================== */

.sunflower-button {

    position: relative;

    width: 210px;
    height: 210px;

    border: none;

    outline: none;

    background: transparent;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

    transition:
        transform 0.8s ease,
        opacity 0.8s ease;
}

.sunflower-button:active {

    transform:
        scale(0.94);
}


/* ==================================================
   PÉTALOS
================================================== */

.petal {

    position: absolute;

    width: 60px;
    height: 96px;

    /*
       El centro de cada pétalo
       queda exactamente en el centro
       del girasol.
    */

    left: 50%;
    top: 50%;

    margin-left: -30px;
    margin-top: -48px;

    border-radius:
        55% 55% 48% 48%;

    transform-origin:
        50% 50%;

    background:
        linear-gradient(
            145deg,
            #ffe982,
            #f5c82d 60%,
            #dda715
        );

    box-shadow:
        inset -4px -5px 8px
        rgba(150, 105, 10, 0.18);

    animation:
        flowerBreath 4s ease-in-out infinite;
}


/*
   Los pétalos salen radialmente
   desde el mismo centro.
*/

.p1 {
    transform:
        rotate(0deg)
        translateY(-48px);
}

.p2 {
    transform:
        rotate(45deg)
        translateY(-48px);
}

.p3 {
    transform:
        rotate(90deg)
        translateY(-48px);
}

.p4 {
    transform:
        rotate(135deg)
        translateY(-48px);
}

.p5 {
    transform:
        rotate(180deg)
        translateY(-48px);
}

.p6 {
    transform:
        rotate(225deg)
        translateY(-48px);
}

.p7 {
    transform:
        rotate(270deg)
        translateY(-48px);
}

.p8 {
    transform:
        rotate(315deg)
        translateY(-48px);
}


/* ==================================================
   CENTRO DEL GIRASOL
================================================== */

.flower-center {

    position: absolute;

    width: 78px;
    height: 78px;

    /*
       CENTRADO PERFECTO
    */

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #936626,
            #553610 55%,
            #321e09 100%
        );

    box-shadow:

        inset
        0 0 0 6px
        rgba(75, 45, 8, 0.4),

        0 8px 20px
        rgba(90, 60, 15, 0.16);

    z-index: 3;
}


/* ==================================================
   DETALLES DEL CENTRO
================================================== */

.flower-center::before {

    content: "";

    position: absolute;

    inset: 12px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 220, 100, 0.28) 1px,
            transparent 1.5px
        );

    background-size:
        7px 7px;
}


/* ==================================================
   ANIMACIÓN SUAVE DEL GIRASOL
================================================== */

@keyframes flowerBreath {

    0%,
    100% {

        filter:
            brightness(1);
    }

    50% {

        filter:
            brightness(1.05);
    }
}


/* ==================================================
   TEXTO "PRESIONA AQUÍ"
================================================== */

.instruction {

    margin-top: 4px;

    color: #655436;

    font-size: 18px;

    letter-spacing: 1px;

    text-align: center;

    animation:
        textPulse 2.2s
        ease-in-out infinite;
}


.instruction::after {

    content: "";

    display: block;

    width: 1px;

    height: 30px;

    background:
        #806b42;

    margin:
        9px auto 0;
}


@keyframes textPulse {

    0%,
    100% {

        opacity:
            0.5;
    }

    50% {

        opacity:
            1;
    }
}


/* ==================================================
   SEMILLA
================================================== */

.seed {

    position: absolute;

    z-index: 20;

    width: 15px;
    height: 23px;

    border-radius:
        60% 60% 50% 50%;

    background:
        linear-gradient(
            135deg,
            #704a17,
            #321e08
        );

    left: 50%;
    top: 40%;

    transform:
        translate(-50%, -50%)
        rotate(25deg);

    opacity: 0;

    pointer-events: none;
}


/* ==================================================
   ANIMACIÓN DE LA SEMILLA
================================================== */

.seed.falling {

    animation:
        seedFall 2.5s
        cubic-bezier(.55, .05, .45, .95)
        forwards;
}


@keyframes seedFall {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -250px)
            rotate(0deg)
            scale(0.7);
    }

    15% {

        opacity: 1;
    }

    45% {

        transform:
            translate(
                calc(-50% + 12px),
                30px
            )
            rotate(150deg)
            scale(1);
    }

    70% {

        transform:
            translate(
                calc(-50% - 8px),
                140px
            )
            rotate(260deg)
            scale(1);
    }

    100% {

        opacity: 1;

        transform:
            translate(
                -50%,
                250px
            )
            rotate(360deg)
            scale(0.9);
    }
}


/* ==================================================
   EFECTO AL TOCAR
================================================== */

.ripple {

    position: absolute;

    width: 20px;
    height: 20px;

    left: 50%;
    top: 50%;

    border-radius: 50%;

    border:
        2px solid
        rgba(190, 145, 37, 0.55);

    transform:
        translate(-50%, -50%)
        scale(0);

    pointer-events: none;
}


.ripple.active {

    animation:
        rippleEffect 1s
        ease-out
        forwards;
}


@keyframes rippleEffect {

    0% {

        opacity: 0.8;

        transform:
            translate(-50%, -50%)
            scale(0);
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(14);
    }
}


/* ==================================================
   MENSAJE PARA PANTALLA VERTICAL
================================================== */

#rotate-message {

    position: fixed;

    inset: 0;

    z-index: 999;

    display: none;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 30px;

    background:
        #f4eddb;

    color:
        #554527;
}


.rotate-content {

    max-width:
        320px;
}


.rotate-icon {

    font-size:
        55px;

    margin-bottom:
        20px;

    animation:
        rotatePhone 2s
        ease-in-out infinite;
}


.rotate-content h2 {

    font-size:
        25px;

    margin-bottom:
        12px;
}


.rotate-content p {

    font-size:
        16px;

    line-height:
        1.6;

    color:
        #756342;
}


@keyframes rotatePhone {

    0%,
    100% {

        transform:
            rotate(0deg);
    }

    50% {

        transform:
            rotate(90deg);
    }
}


/* ==================================================
   MODO VERTICAL
================================================== */

@media
(orientation: portrait)
and (max-width: 900px) {

    #rotate-message {

        display:
            flex;
    }

    #intro {

        display:
            none;
    }
}


/* ==================================================
   IPHONE EN HORIZONTAL
================================================== */

@media
(orientation: landscape)
and (max-height: 500px) {

    .sunflower-button {

        width:
            175px;

        height:
            175px;
    }


    .petal {

        width:
            50px;

        height:
            80px;

        margin-left:
            -25px;

        margin-top:
            -40px;
    }


    .p1 {
        transform:
            rotate(0deg)
            translateY(-40px);
    }

    .p2 {
        transform:
            rotate(45deg)
            translateY(-40px);
    }

    .p3 {
        transform:
            rotate(90deg)
            translateY(-40px);
    }

    .p4 {
        transform:
            rotate(135deg)
            translateY(-40px);
    }

    .p5 {
        transform:
            rotate(180deg)
            translateY(-40px);
    }

    .p6 {
        transform:
            rotate(225deg)
            translateY(-40px);
    }

    .p7 {
        transform:
            rotate(270deg)
            translateY(-40px);
    }

    .p8 {
        transform:
            rotate(315deg)
            translateY(-40px);
    }


    .flower-center {

        width:
            65px;

        height:
            65px;

        left:
            50%;

        top:
            50%;

        transform:
            translate(-50%, -50%);
    }


    .instruction {

        font-size:
            16px;
    }
}


/* ==================================================
   PANTALLAS MUY BAJAS
================================================== */

@media
(orientation: landscape)
and (max-height: 380px) {

    .sunflower-button {

        transform:
            scale(0.85);
    }

    .instruction {

        margin-top:
            -10px;
    }
}

</style>
</head>


<body>


<!-- ==================================================
     AVISO DE GIRAR EL TELÉFONO
================================================== -->

<section id="rotate-message">

    <div class="rotate-content">

        <div class="rotate-icon">
            📱
        </div>

        <h2>
            Gira tu teléfono
        </h2>

        <p>
            Esta pequeña historia está hecha
            para disfrutarse en horizontal. 🌻
        </p>

    </div>

</section>


<!-- ==================================================
     ESCENA PRINCIPAL
================================================== -->

<main id="intro">

    <div class="intro-content">


        <!-- GIRASOL -->

        <button
            id="sunflowerButton"
            class="sunflower-button"
            aria-label="Presiona el girasol">


            <span class="petal p1"></span>

            <span class="petal p2"></span>

            <span class="petal p3"></span>

            <span class="petal p4"></span>

            <span class="petal p5"></span>

            <span class="petal p6"></span>

            <span class="petal p7"></span>

            <span class="petal p8"></span>


            <span
                class="flower-center">
            </span>


            <!-- EFECTO DE ONDA -->

            <span
                id="ripple"
                class="ripple">
            </span>

        </button>


        <!-- TEXTO -->

        <div class="instruction">
            Presiona aquí
        </div>

    </div>


    <!-- ==================================================
         SEMILLA
    ================================================== -->

    <div
        id="seed"
        class="seed">
    </div>


</main>


<script>

/* ==================================================
   ELEMENTOS
================================================== */

const sunflowerButton =
    document.getElementById(
        "sunflowerButton"
    );

const intro =
    document.getElementById(
        "intro"
    );

const seed =
    document.getElementById(
        "seed"
    );

const ripple =
    document.getElementById(
        "ripple"
    );


/* ==================================================
   ESTADO
================================================== */

let started =
    false;


/* ==================================================
   CUANDO TOCA EL GIRASOL
================================================== */

sunflowerButton.addEventListener(
    "click",
    startExperience
);


/* ==================================================
   COMENZAR EXPERIENCIA
================================================== */

function startExperience() {


    /*
       Evitamos que se pueda
       presionar varias veces.
    */

    if (started) {

        return;
    }


    started =
        true;


    /* ------------------------------------------
       1. EFECTO DE ONDA
    ------------------------------------------ */

    ripple.classList.remove(
        "active"
    );

    /*
       Reiniciamos la animación.
    */

    void ripple.offsetWidth;

    ripple.classList.add(
        "active"
    );


    /* ------------------------------------------
       2. DESAPARECE EL GIRASOL
    ------------------------------------------ */

    setTimeout(() => {

        sunflowerButton.style.transform =
            "scale(0.7)";

        sunflowerButton.style.opacity =
            "0";

    }, 450);


    /* ------------------------------------------
       3. CAE LA SEMILLA
    ------------------------------------------ */

    setTimeout(() => {

        seed.classList.add(
            "falling"
        );

    }, 850);


    /*
       AQUÍ TERMINA TEMPORALMENTE
       LA PRIMERA ESCENA.

       En la siguiente etapa vamos a conectar:

       SEMILLA
          ↓
       TIERRA
          ↓
       BROTE
          ↓
       PASTO
          ↓
       CAMPO
          ↓
       GIRASOLES
          ↓
       TENDEDERO
    */

}

</script>

</body>
</html>

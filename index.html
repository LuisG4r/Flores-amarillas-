<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Para ti 🌻</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#f8f0df;
}

/* =========================
   PANTALLA GIRAR TELÉFONO
========================= */

.rotate-screen{
    position:fixed;
    inset:0;
    background:#f8f0df;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}

.phone-animation{
    width:55px;
    height:95px;
    border:3px solid #6e5b45;
    border-radius:12px;
    position:relative;
    animation:phoneRotate 2.5s ease-in-out infinite;
}

.phone-animation::before{
    content:"";
    position:absolute;
    width:20px;
    height:3px;
    border-radius:5px;
    background:#6e5b45;
    top:7px;
    left:50%;
    transform:translateX(-50%);
}

.phone-animation::after{
    content:"";
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#6e5b45;
    bottom:7px;
    left:50%;
    transform:translateX(-50%);
}

.rotate-text{
    margin-top:22px;
    color:#6e5b45;
    font-family:Georgia,"Times New Roman",serif;
    font-size:18px;
    font-style:italic;
}

@keyframes phoneRotate{
    0%{transform:rotate(0deg);}
    35%{transform:rotate(90deg);}
    65%{transform:rotate(90deg);}
    100%{transform:rotate(0deg);}
}


/* =========================
   INTRO
========================= */

#intro{
    position:fixed;
    inset:0;
    background:#f8f0df;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    transition:opacity 1.5s ease;
}

.intro-flower{
    position:relative;
    width:170px;
    height:170px;
    cursor:pointer;
    animation:floatFlower 3s ease-in-out infinite;
}

@keyframes floatFlower{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
}

.petal{
    position:absolute;
    width:58px;
    height:82px;
    background:#f5b72e;
    border-radius:50% 50% 45% 45%;
    left:50%;
    top:50%;
    transform-origin:50% 100%;
}

.petal:nth-child(1){transform:translate(-50%,-100%) rotate(0deg);}
.petal:nth-child(2){transform:translate(-50%,-100%) rotate(45deg);}
.petal:nth-child(3){transform:translate(-50%,-100%) rotate(90deg);}
.petal:nth-child(4){transform:translate(-50%,-100%) rotate(135deg);}
.petal:nth-child(5){transform:translate(-50%,-100%) rotate(180deg);}
.petal:nth-child(6){transform:translate(-50%,-100%) rotate(225deg);}
.petal:nth-child(7){transform:translate(-50%,-100%) rotate(270deg);}
.petal:nth-child(8){transform:translate(-50%,-100%) rotate(315deg);}

.flower-center{
    position:absolute;
    width:65px;
    height:65px;
    border-radius:50%;
    background:#65401f;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:5;
}

.flower-center::after{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    background:
        radial-gradient(circle,#2f1b0d 1.5px,transparent 2px);
    background-size:8px 8px;
}

.press-text{
    margin-top:30px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:19px;
    color:#6e5b45;
    font-style:italic;
}


/* =========================
   MENSAJES
========================= */

#messages{
    position:fixed;
    inset:0;
    background:#f8f0df;
    z-index:90;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.2s ease;
}

.message{
    position:absolute;
    width:85%;
    color:#6e5b45;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(24px,4vw,42px);
    font-style:italic;
    line-height:1.5;
    opacity:0;
    transition:opacity 1.3s ease;
}


/* =========================
   JARDÍN
========================= */

#garden{
    position:fixed;
    inset:0;
    opacity:0;
    z-index:10;
    overflow:hidden;

    background:
        linear-gradient(
            to bottom,
            #a9ddea 0%,
            #bce4e2 37%,
            #dce7d1 49%,
            #8fbd58 50%,
            #65a844 100%
        );

    transition:opacity 2s ease;
}


/* =========================
   SOL
========================= */

.sun{
    position:absolute;
    width:115px;
    height:115px;
    border-radius:50%;
    background:#ffd75b;
    right:8%;
    top:9%;
    box-shadow:
        0 0 45px rgba(255,215,91,.45);
    z-index:1;
}


/* =========================
   NUBES
========================= */

.cloud{
    position:absolute;
    width:130px;
    height:35px;
    background:rgba(255,255,255,.55);
    border-radius:30px;
    z-index:2;
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    background:rgba(255,255,255,.55);
    border-radius:50%;
}

.cloud::before{
    width:55px;
    height:55px;
    left:20px;
    bottom:8px;
}

.cloud::after{
    width:70px;
    height:70px;
    right:15px;
    bottom:4px;
}

.cloud.one{
    left:9%;
    top:15%;
    transform:scale(.75);
}

.cloud.two{
    left:43%;
    top:10%;
    transform:scale(.55);
}


/* =========================
   PASTO
========================= */

.grass{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:52%;
    background:
        linear-gradient(
            to bottom,
            #8fbd58 0%,
            #76ad4a 30%,
            #65a844 65%,
            #57913a 100%
        );
    z-index:2;
}


/* =========================
   DETALLES DEL PASTO
========================= */

.grass-blade{
    position:absolute;
    width:3px;
    height:18px;
    background:#477d32;
    border-radius:5px;
    bottom:0;
    transform-origin:bottom center;
    opacity:.65;
}

.grass-blade:nth-child(1){left:4%;transform:rotate(-12deg);}
.grass-blade:nth-child(2){left:11%;height:25px;transform:rotate(15deg);}
.grass-blade:nth-child(3){left:19%;height:16px;transform:rotate(-8deg);}
.grass-blade:nth-child(4){left:27%;height:24px;transform:rotate(13deg);}
.grass-blade:nth-child(5){left:36%;height:19px;transform:rotate(-15deg);}
.grass-blade:nth-child(6){left:45%;height:26px;transform:rotate(10deg);}
.grass-blade:nth-child(7){left:54%;height:18px;transform:rotate(-12deg);}
.grass-blade:nth-child(8){left:64%;height:25px;transform:rotate(14deg);}
.grass-blade:nth-child(9){left:73%;height:17px;transform:rotate(-10deg);}
.grass-blade:nth-child(10){left:83%;height:24px;transform:rotate(12deg);}
.grass-blade:nth-child(11){left:92%;height:19px;transform:rotate(-14deg);}


/* =========================
   TENDEDERO
========================= */

.clothesline{
    position:absolute;
    top:7%;
    left:7%;
    width:86%;
    height:190px;
    z-index:5;
}

.clothesline-post{
    position:absolute;
    width:8px;
    height:185px;
    background:#806346;
    border-radius:8px;
    top:0;
    z-index:6;
}

.clothesline-post.left{left:0;}
.clothesline-post.right{right:0;}

.clothesline-rope{
    position:absolute;
    left:0;
    right:0;
    top:30px;
    height:4px;
    background:#806346;
    border-radius:5px;
    z-index:6;
}

.clothesline-rope::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:18px;
    height:2px;
    background:rgba(128,99,70,.4);
    transform:rotate(1deg);
}


/* =========================
   CAMPO
========================= */

.sunflower-field{
    position:absolute;
    left:2%;
    right:2%;
    top:49%;
    height:51%;
    overflow:visible;
    z-index:10;
}


/* =========================
   GIRASOLES
   SIN TALLO
========================= */

.field-flower{
    position:absolute;
    width:60px;
    height:var(--flower-height);
    left:var(--left);
    top:var(--top);

    transform:
        scale(var(--scale))
        rotate(var(--rotate));

    transform-origin:bottom center;

    z-index:var(--z);
    cursor:pointer;

    transition:
        transform .35s ease,
        filter .35s ease;
}

.field-flower:hover{
    filter:brightness(1.08);
}


/* =========================
   GIRASOLES ESPECIALES
   BRILLITO SUTIL
========================= */

.field-flower.special{
    cursor:pointer;
}

.field-flower.special::after{
    content:"";
    position:absolute;

    width:72px;
    height:72px;

    left:50%;
    top:var(--head-offset);

    transform:translate(-50%,-8%);

    border-radius:50%;

    background:radial-gradient(
        circle,
        rgba(255,221,91,.30) 0%,
        rgba(255,221,91,.12) 35%,
        rgba(255,221,91,0) 70%
    );

    opacity:.25;

    animation:
        subtleGlow 3.2s ease-in-out infinite;

    pointer-events:none;

    z-index:10;
}

@keyframes subtleGlow{

    0%,100%{
        opacity:.12;
        transform:translate(-50%,-8%) scale(.88);
    }

    50%{
        opacity:.45;
        transform:translate(-50%,-8%) scale(1.08);
    }

}


/* =========================
   CABEZA
========================= */

.field-head{
    position:absolute;
    width:60px;
    height:60px;
    left:50%;
    top:var(--head-offset);
    transform:translateX(-50%);
    z-index:5;
}

.field-petal{
    position:absolute;
    width:22px;
    height:34px;
    background:#f4b72c;
    border-radius:50% 50% 45% 45%;
    left:50%;
    top:50%;
    transform-origin:50% 100%;
}

.field-petal:nth-child(1){transform:translate(-50%,-100%) rotate(0deg);}
.field-petal:nth-child(2){transform:translate(-50%,-100%) rotate(45deg);}
.field-petal:nth-child(3){transform:translate(-50%,-100%) rotate(90deg);}
.field-petal:nth-child(4){transform:translate(-50%,-100%) rotate(135deg);}
.field-petal:nth-child(5){transform:translate(-50%,-100%) rotate(180deg);}
.field-petal:nth-child(6){transform:translate(-50%,-100%) rotate(225deg);}
.field-petal:nth-child(7){transform:translate(-50%,-100%) rotate(270deg);}
.field-petal:nth-child(8){transform:translate(-50%,-100%) rotate(315deg);}

.field-center{
    position:absolute;
    width:28px;
    height:28px;
    border-radius:50%;
    background:#65401f;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:4;
}

.field-center::after{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:50%;
    background:
        radial-gradient(circle,#2f1b0d 1px,transparent 1.5px);
    background-size:5px 5px;
}


/* =========================
   VENTANA DE FRASE
========================= */

.flower-message{
    position:fixed;
    inset:0;
    z-index:400;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    background:rgba(71,55,38,.28);

    backdrop-filter:blur(3px);

    opacity:0;
    visibility:hidden;

    transition:
        opacity .45s ease,
        visibility .45s ease;
}

.flower-message.show{
    opacity:1;
    visibility:visible;
}

.flower-card{
    width:min(520px,90vw);

    background:#fffaf0;

    border-radius:22px;

    padding:35px 30px 28px;

    text-align:center;

    box-shadow:
        0 15px 50px rgba(70,50,30,.25);

    transform:
        translateY(25px)
        scale(.92);

    transition:
        transform .45s ease;
}

.flower-message.show .flower-card{
    transform:
        translateY(0)
        scale(1);
}

.card-flower{
    font-size:38px;
    margin-bottom:15px;
}

.flower-card p{
    color:#6e5b45;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(20px,3.5vw,29px);

    line-height:1.5;

    font-style:italic;
}

.close-message{
    margin-top:25px;

    border:none;

    background:#d89b32;

    color:white;

    padding:10px 25px;

    border-radius:20px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:16px;

    cursor:pointer;
}


/* =========================
   EFECTO AL TOCAR
========================= */

.ripple{
    position:fixed;
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid rgba(255,190,40,.8);
    pointer-events:none;

    transform:
        translate(-50%,-50%)
        scale(0);

    animation:
        rippleEffect 1s ease-out forwards;

    z-index:500;
}

@keyframes rippleEffect{

    to{

        transform:
            translate(-50%,-50%)
            scale(12);

        opacity:0;

    }

}


/* =========================
   SEMILLA
========================= */

.seed{
    position:fixed;
    width:10px;
    height:15px;
    border-radius:50%;
    background:#6c431d;
    left:50%;
    top:50%;
    z-index:300;
    opacity:0;

    transform:
        translate(-50%,-50%);
}

.seed.fall{
    animation:
        seedFall 2.5s ease-in forwards;
}

@keyframes seedFall{

    0%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,300px)
            rotate(180deg);
    }

}


/* =========================
   RESPONSIVE
========================= */

@media (max-width:700px){

    .intro-flower{
        transform:scale(.85);
    }

    .press-text{
        font-size:17px;
    }

    .message{
        font-size:25px;
        width:88%;
    }

    .sun{
        width:80px;
        height:80px;
        right:7%;
    }

    .clothesline{
        left:5%;
        width:90%;
    }

    .field-head{
        width:54px;
        height:54px;
    }

    .field-petal{
        width:20px;
        height:31px;
    }

    .field-center{
        width:25px;
        height:25px;
    }

}


/* =========================
   VERTICAL
========================= */

@media (orientation:portrait){

    #intro,
    #messages,
    #garden{
        display:none;
    }

    .rotate-screen{
        display:flex;
    }

}

</style>
</head>

/* =========================
   CREAR GIRASOLES
========================= */

flowers.forEach((flower,index)=>{

    const flowerElement =
        document.createElement("div");

    flowerElement.className =
        "field-flower";


    flowerElement.style.setProperty(
        "--left",
        flower.left
    );

    flowerElement.style.setProperty(
        "--top",
        flower.top
    );

    flowerElement.style.setProperty(
        "--scale",
        flower.scale
    );

    flowerElement.style.setProperty(
        "--rotate",
        flower.rotate
    );

    flowerElement.style.setProperty(
        "--head-offset",
        flower.headOffset
    );

    flowerElement.style.setProperty(
        "--flower-height",
        flower.flowerHeight
    );

    flowerElement.style.setProperty(
        "--z",
        flower.z
    );


    /* =========================
       FLORES ESPECIALES
    ========================= */

    if(index === 4 || index === 15){

        flowerElement.classList.add(
            "special"
        );

        flowerElement.dataset.message =
            index === 4
            ?
            "Eres mi vida y por ello quiero estar a tu lado mil y un vidas"
            :
            "Esta aventura que estamos emprendiendo me alegra de que sea a tu lado";

    }


    flowerElement.innerHTML = `

        <div class="field-head">

            <div class="field-petal"></div>
            <div class="field-petal"></div>
            <div class="field-petal"></div>
            <div class="field-petal"></div>
            <div class="field-petal"></div>
            <div class="field-petal"></div>
            <div class="field-petal"></div>
            <div class="field-petal"></div>

            <div class="field-center"></div>

        </div>

    `;


    sunflowerField.appendChild(
        flowerElement
    );


    /* =========================
       CLICK
    ========================= */

    if(
        flowerElement.classList.contains(
            "special"
        )
    ){

        flowerElement.addEventListener(
            "click",
            (event)=>{

                event.stopPropagation();

                flowerMessageText.textContent =
                    flowerElement.dataset.message;

                flowerMessage.classList.add(
                    "show"
                );

            }
        );

    }

});

========================= */

closeMessage.addEventListener(

);

========================= */

    (event)=>{

        if(

);

    (event)=>{

            document.createElement("div");

        ripple.className =
            "ripple";

        ripple.style.left =
            event.clientX+"px";

        ripple.style.top =
            event.clientY+"px";

        document.body.appendChild(
            ripple
        );


        setTimeout(()=>{
            ripple.remove();
        },1000);


        seed.classList.add(
            "fall"
        );


        intro.style.opacity =

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<meta name="theme-color" content="#f4eddb">

<title>Para ti 🌻</title>


<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background: #f4eddb;
}


/* =====================================================
   ESCENA 1 — GIRASOL
===================================================== */

#intro {

    position: relative;

    width: 100vw;
    height: 100dvh;

    display: flex;

    justify-content: center;
    align-items: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #fbf7ec 0%,
            #f4eddb 65%,
            #eee2c9 100%
        );

    transition:
        opacity 1.2s ease;
}


/* Textura de papel */

#intro::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: .18;

    background-image:
        radial-gradient(
            rgba(100,75,35,.18) .7px,
            transparent .7px
        );

    background-size: 5px 5px;
}


.intro-content {

    position: relative;

    z-index: 5;

    display: flex;

    flex-direction: column;

    align-items: center;

    transform: translateY(-3%);
}


/* =====================================================
   GIRASOL INICIAL
===================================================== */

.sunflower-button {

    position: relative;

    width: 210px;
    height: 210px;

    border: none;

    outline: none;

    background: transparent;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

    transition:
        transform .8s ease,
        opacity .8s ease;
}


.sunflower-button:active {

    transform: scale(.94);
}


/* Pétalos */

.petal {

    position: absolute;

    width: 60px;
    height: 96px;

    left: 50%;
    top: 50%;

    margin-left: -30px;
    margin-top: -48px;

    border-radius:
        55% 55% 48% 48%;

    transform-origin: 50% 50%;

    background:
        linear-gradient(
            145deg,
            #ffe982,
            #f5c82d 60%,
            #dda715
        );

    box-shadow:
        inset -4px -5px 8px
        rgba(150,105,10,.18);

    animation:
        flowerBreath 4s ease-in-out infinite;
}


.p1 { transform: rotate(0deg) translateY(-48px); }
.p2 { transform: rotate(45deg) translateY(-48px); }
.p3 { transform: rotate(90deg) translateY(-48px); }
.p4 { transform: rotate(135deg) translateY(-48px); }
.p5 { transform: rotate(180deg) translateY(-48px); }
.p6 { transform: rotate(225deg) translateY(-48px); }
.p7 { transform: rotate(270deg) translateY(-48px); }
.p8 { transform: rotate(315deg) translateY(-48px); }


/* Centro */

.flower-center {

    position: absolute;

    width: 78px;
    height: 78px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #936626,
            #553610 55%,
            #321e09 100%
        );

    box-shadow:
        inset 0 0 0 6px
        rgba(75,45,8,.4),

        0 8px 20px
        rgba(90,60,15,.16);

    z-index: 3;
}


.flower-center::before {

    content: "";

    position: absolute;

    inset: 12px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,220,100,.28) 1px,
            transparent 1.5px
        );

    background-size: 7px 7px;
}


@keyframes flowerBreath {

    0%,100% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(1.05);
    }
}


/* =====================================================
   TEXTO
===================================================== */

.instruction {

    margin-top: 4px;

    color: #655436;

    font-size: 18px;

    letter-spacing: 1px;

    text-align: center;

    animation:
        textPulse 2.2s ease-in-out infinite;
}


.instruction::after {

    content: "";

    display: block;

    width: 1px;

    height: 30px;

    background: #806b42;

    margin: 9px auto 0;
}


@keyframes textPulse {

    0%,100% {
        opacity: .5;
    }

    50% {
        opacity: 1;
    }
}


/* =====================================================
   EFECTO DE ONDA
===================================================== */

.ripple {

    position: absolute;

    width: 20px;
    height: 20px;

    left: 50%;
    top: 50%;

    border-radius: 50%;

    border:
        2px solid
        rgba(190,145,37,.55);

    transform:
        translate(-50%,-50%)
        scale(0);

    pointer-events: none;
}


.ripple.active {

    animation:
        rippleEffect 1s ease-out
        forwards;
}


@keyframes rippleEffect {

    0% {
        opacity: .8;

        transform:
            translate(-50%,-50%)
            scale(0);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(14);
    }
}


/* =====================================================
   ESCENA 2 — JARDÍN
===================================================== */

#garden {

    position: fixed;

    inset: 0;

    display: none;

    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #dcebdc 0%,
            #c9dfce 48%,
            #a7c79e 49%,
            #6d984b 100%
        );

    opacity: 0;

    transition:
        opacity 1.5s ease;
}


/* =====================================================
   CIELO
===================================================== */

.sky {

    position: absolute;

    inset: 0 0 45% 0;

    background:
        linear-gradient(
            to bottom,
            #c9e1e4,
            #e9e1c9
        );
}


/* Luz del sol */

.sun-glow {

    position: absolute;

    width: 180px;
    height: 180px;

    right: 10%;
    top: 7%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,240,170,.75),
            rgba(255,240,170,0) 70%
        );
}


/* =====================================================
   SUELO
===================================================== */

.soil {

    position: absolute;

    left: 0;
    right: 0;

    bottom: 0;

    height: 53%;

    background:
        linear-gradient(
            to bottom,
            #6f522d,
            #4a351f
        );

    transform:
        scaleY(0);

    transform-origin:
        bottom;

    transition:
        transform 1.4s ease;
}


#garden.grow-soil .soil {

    transform:
        scaleY(1);
}


/* =====================================================
   VERDE
===================================================== */

.grass {

    position: absolute;

    left: 0;
    right: 0;

    bottom: 0;

    height: 42%;

    background:
        linear-gradient(
            to bottom,
            #4d7e35,
            #315b25
        );

    transform:
        scaleY(0);

    transform-origin:
        bottom;

    transition:
        transform 2.2s ease;
}


#garden.grow-grass .grass {

    transform:
        scaleY(1);
}


/* Textura de pasto */

.grass::after {

    content: "";

    position: absolute;

    inset: 0;

    opacity: .4;

    background:
        repeating-linear-gradient(
            75deg,
            transparent 0 7px,
            rgba(120,170,70,.35) 8px 10px
        );
}


/* =====================================================
   BROTE
===================================================== */

.sprout {

    position: absolute;

    left: 50%;
    bottom: 23%;

    width: 8px;
    height: 100px;

    background:
        linear-gradient(
            to top,
            #315f27,
            #57963c
        );

    border-radius: 10px;

    transform:
        translateX(-50%)
        scaleY(0);

    transform-origin:
        bottom;

    z-index: 8;

    transition:
        transform 1.7s
        cubic-bezier(.2,.8,.2,1);
}


#garden.grow-sprout .sprout {

    transform:
        translateX(-50%)
        scaleY(1);
}


/* Hojas */

.sprout::before,
.sprout::after {

    content: "";

    position: absolute;

    width: 45px;
    height: 23px;

    background: #4c8b36;

    border-radius:
        100% 0 100% 0;
}


.sprout::before {

    left: -38px;
    top: 45px;

    transform:
        rotate(-18deg);
}


.sprout::after {

    right: -38px;
    top: 25px;

    transform:
        scaleX(-1)
        rotate(-18deg);
}


/* =====================================================
   CAMPO DE GIRASOLES
===================================================== */

.sunflower-field {

    position: absolute;

    inset: 0;

    z-index: 10;

    opacity: 0;

    transition:
        opacity 1.5s ease;
}


#garden.show-field .sunflower-field {

    opacity: 1;
}


/* =====================================================
   GIRASOLES DEL CAMPO
===================================================== */

.field-flower {

    position: absolute;

    width: 75px;
    height: 135px;

    transform:
        scale(0);

    animation:
        none;

    cursor: pointer;
}


#garden.show-field .field-flower {

    animation:
        flowerGrow .8s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


@keyframes flowerGrow {

    0% {
        transform:
            scale(0)
            translateY(30px);
    }

    70% {
        transform:
            scale(1.08)
            translateY(-3px);
    }

    100% {
        transform:
            scale(1)
            translateY(0);
    }
}


/* Tallo */

.field-stem {

    position: absolute;

    width: 6px;

    height: 90px;

    left: 35px;

    bottom: 0;

    background:
        linear-gradient(
            to right,
            #315c26,
            #57913a
        );

    border-radius: 10px;
}


/* Hoja */

.field-leaf {

    position: absolute;

    width: 35px;
    height: 18px;

    background: #4d8735;

    border-radius:
        100% 0;
}


.field-leaf.left {

    left: 1px;

    bottom: 35px;

    transform:
        rotate(-20deg);
}


.field-leaf.right {

    right: 0;

    bottom: 52px;

    transform:
        scaleX(-1)
        rotate(20deg);
}


/* Cabeza */

.field-head {

    position: absolute;

    width: 54px;
    height: 54px;

    left: 10px;

    top: 0;
}


/* Pétalos */

.field-petal {

    position: absolute;

    width: 19px;
    height: 30px;

    left: 18px;
    top: 12px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #ffe77a,
            #eebc21
        );

    transform-origin:
        50% 50%;
}


.fp1 { transform: rotate(0deg) translateY(-17px); }
.fp2 { transform: rotate(45deg) translateY(-17px); }
.fp3 { transform: rotate(90deg) translateY(-17px); }
.fp4 { transform: rotate(135deg) translateY(-17px); }
.fp5 { transform: rotate(180deg) translateY(-17px); }
.fp6 { transform: rotate(225deg) translateY(-17px); }
.fp7 { transform: rotate(270deg) translateY(-17px); }
.fp8 { transform: rotate(315deg) translateY(-17px); }


.field-center {

    position: absolute;

    width: 27px;
    height: 27px;

    left: 13px;
    top: 13px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #80551b,
            #382008
        );

    z-index: 3;
}


/* =====================================================
   TENDEDERO
===================================================== */

.clothesline {

    position: absolute;

    z-index: 30;

    top: 5%;

    left: 5%;

    width: 90%;

    height: 90px;

    opacity: 0;

    transform:
        translateY(-20px);

    transition:
        opacity 1.3s ease,
        transform 1.3s ease;
}


#garden.show-line .clothesline {

    opacity: 1;

    transform:
        translateY(0);
}


/* Cuerda */

.rope {

    position: absolute;

    left: 3%;
    right: 3%;

    top: 28px;

    height: 3px;

    background:
        #604628;

    border-radius: 50%;

    box-shadow:
        0 2px 3px
        rgba(0,0,0,.15);
}


/* Postes */

.line-post {

    position: absolute;

    width: 9px;
    height: 100px;

    top: 8px;

    background:
        #664728;

    border-radius: 5px;
}


.line-post.left {
    left: 0;
}


.line-post.right {
    right: 0;
}


/* =====================================================
   MENSAJE DEL JARDÍN
===================================================== */

.garden-message {

    position: absolute;

    z-index: 40;

    left: 50%;

    bottom: 8%;

    transform:
        translateX(-50%)
        translateY(20px);

    width: 90%;

    max-width: 650px;

    text-align: center;

    color:
        #fff9df;

    text-shadow:
        0 2px 5px
        rgba(0,0,0,.35);

    opacity: 0;

    transition:
        opacity 1.3s ease,
        transform 1.3s ease;
}


#garden.show-message .garden-message {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}


.garden-message h1 {

    font-size:
        clamp(20px, 4vw, 34px);

    margin-bottom:
        8px;
}


.garden-message p {

    font-size:
        clamp(13px, 2vw, 18px);

    line-height:
        1.5;
}


/* =====================================================
   AVISO VERTICAL
===================================================== */

#rotate-message {

    position: fixed;

    inset: 0;

    z-index: 999;

    display: none;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 30px;

    background:
        #f4eddb;

    color:
        #554527;
}


.rotate-content {

    max-width: 320px;
}


.rotate-icon {

    font-size: 55px;

    margin-bottom: 20px;

    animation:
        rotatePhone 2s
        ease-in-out infinite;
}


.rotate-content h2 {

    font-size: 25px;

    margin-bottom: 12px;
}


.rotate-content p {

    font-size: 16px;

    line-height: 1.6;

    color: #756342;
}


@keyframes rotatePhone {

    0%,100% {
        transform: rotate(0deg);
    }

    50% {
        transform: rotate(90deg);
    }
}


/* =====================================================
   IPHONE VERTICAL
===================================================== */

@media
(orientation: portrait)
and (max-width: 900px) {

    #rotate-message {

        display:
            flex;
    }

    #intro {

        display:
            none;
    }

    #garden {

        display:
            none !important;
    }
}


/* =====================================================
   HORIZONTAL — IPHONE 13
===================================================== */

@media
(orientation: landscape)
and (max-height: 500px) {

    .sunflower-button {

        width: 175px;
        height: 175px;
    }


    .petal {

        width: 50px;
        height: 80px;

        margin-left: -25px;
        margin-top: -40px;
    }


    .p1 { transform: rotate(0deg) translateY(-40px); }
    .p2 { transform: rotate(45deg) translateY(-40px); }
    .p3 { transform: rotate(90deg) translateY(-40px); }
    .p4 { transform: rotate(135deg) translateY(-40px); }
    .p5 { transform: rotate(180deg) translateY(-40px); }
    .p6 { transform: rotate(225deg) translateY(-40px); }
    .p7 { transform: rotate(270deg) translateY(-40px); }
    .p8 { transform: rotate(315deg) translateY(-40px); }


    .flower-center {

        width: 65px;
        height: 65px;

        left: 50%;
        top: 50%;

        transform:
            translate(-50%, -50%);
    }


    .instruction {

        font-size: 16px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     AVISO PARA GIRAR EL TELÉFONO
===================================================== -->

<section id="rotate-message">

    <div class="rotate-content">

        <div class="rotate-icon">
            📱
        </div>

        <h2>
            Gira tu teléfono
        </h2>

        <p>
            Esta pequeña historia está hecha
            para disfrutarse en horizontal. 🌻
        </p>

    </div>

</section>



<!-- =====================================================
     ESCENA 1
===================================================== -->

<main id="intro">

    <div class="intro-content">


        <button
            id="sunflowerButton"
            class="sunflower-button"
            aria-label="Presiona el girasol">


            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="petal p6"></span>
            <span class="petal p7"></span>
            <span class="petal p8"></span>


            <span
                class="flower-center">
            </span>


            <span
                id="ripple"
                class="ripple">
            </span>

        </button>


        <div class="instruction">
            Presiona aquí
        </div>

    </div>

</main>



<!-- =====================================================
     ESCENA 2 — JARDÍN
===================================================== -->

<section id="garden">


    <!-- Cielo -->

    <div class="sky"></div>


    <!-- Luz -->

    <div class="sun-glow"></div>


    <!-- Tierra -->

    <div class="soil"></div>


    <!-- Pasto -->

    <div class="grass"></div>


    <!-- Brote -->

    <div class="sprout"></div>


    <!-- Campo de flores -->

    <div
        id="sunflowerField"
        class="sunflower-field">
    </div>


    <!-- Tendedero -->

    <div class="clothesline">

        <div
            class="line-post left">
        </div>

        <div
            class="line-post right">
        </div>

        <div class="rope"></div>

    </div>


    <!-- Mensaje -->

    <div class="garden-message">

        <h1>
            Un pequeño jardín para ti 🌻
        </h1>

        <p>
            Hay algunos recuerdos escondidos
            entre estas flores...
        </p>

    </div>


</section>



<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const intro =
    document.getElementById("intro");

const garden =
    document.getElementById("garden");

const sunflowerButton =
    document.getElementById("sunflowerButton");

const ripple =
    document.getElementById("ripple");


let started = false;


/* =====================================================
   GIRASOL PRINCIPAL
===================================================== */

sunflowerButton.addEventListener(
    "click",
    startExperience
);


/* =====================================================
   COMENZAR
===================================================== */

function startExperience() {


    if (started) {
        return;
    }


    started = true;


    /* ---------------------------------------------
       EFECTO DE ONDA
    --------------------------------------------- */

    ripple.classList.remove(
        "active"
    );

    void ripple.offsetWidth;

    ripple.classList.add(
        "active"
    );


    /* ---------------------------------------------
       EL GIRASOL DESAPARECE
    --------------------------------------------- */

    setTimeout(() => {

        sunflowerButton.style.transform =
            "scale(.7)";

        sunflowerButton.style.opacity =
            "0";

    }, 450);


    /* ---------------------------------------------
       CAMBIAMOS AL JARDÍN
    --------------------------------------------- */

    setTimeout(() => {

        intro.style.opacity =
            "0";


        setTimeout(() => {

            intro.style.display =
                "none";


            garden.style.display =
                "block";


            /*
               Forzamos al navegador
               a reconocer el cambio.
            */

            requestAnimationFrame(() => {

                garden.style.opacity =
                    "1";

            });


        }, 1000);


    }, 1200);


    /* ---------------------------------------------
       TIERRA
    --------------------------------------------- */

    setTimeout(() => {

        garden.classList.add(
            "grow-soil"
        );

    }, 1900);


    /* ---------------------------------------------
       BROTE
    --------------------------------------------- */

    setTimeout(() => {

        garden.classList.add(
            "grow-sprout"
        );

    }, 3300);


    /* ---------------------------------------------
       PASTO
    --------------------------------------------- */

    setTimeout(() => {

        garden.classList.add(
            "grow-grass"
        );

    }, 4500);


    /* ---------------------------------------------
       GIRASOLES
    --------------------------------------------- */

    setTimeout(() => {

        createFieldFlowers();

        garden.classList.add(
            "show-field"
        );

    }, 6500);


    /* ---------------------------------------------
       TENDEDERO
    --------------------------------------------- */

    setTimeout(() => {

        garden.classList.add(
            "show-line"
        );

    }, 7600);


    /* ---------------------------------------------
       MENSAJE
    --------------------------------------------- */

    setTimeout(() => {

        garden.classList.add(
            "show-message"
        );

    }, 8500);

}


/* =====================================================
   CREAR GIRASOLES DEL CAMPO
===================================================== */

function createFieldFlowers() {


    const field =
        document.getElementById(
            "sunflowerField"
        );


    /*
       Posiciones manuales para que
       el campo se vea natural en horizontal.
    */

    const positions = [

        [7, 8],
        [17, 18],
        [28, 6],
        [39, 20],
        [50, 8],
        [61, 19],
        [72, 7],
        [84, 20],

        [4, 35],
        [14, 47],
        [25, 34],
        [36, 49],
        [48, 35],
        [59, 48],
        [70, 34],
        [81, 46],
        [91, 33],

        [9, 62],
        [21, 74],
        [34, 60],
        [46, 75],
        [58, 62],
        [69, 76],
        [80, 61],
        [91, 72]

    ];


    positions.forEach(
        (position, index) => {


            const flower =
                document.createElement(
                    "div"
                );


            flower.className =
                "field-flower";


            /*
               left
            */

            flower.style.left =
                position[0] + "%";


            /*
               bottom
            */

            flower.style.bottom =
                position[1] + "%";


            /*
               Cada flor aparece
               ligeramente después
               de la anterior.
            */

            flower.style.animationDelay =
                (index * 0.08) + "s";


            flower.innerHTML = `

                <div class="field-stem"></div>

                <div class="
                    field-leaf
                    left">
                </div>

                <div class="
                    field-leaf
                    right">
                </div>


                <div class="field-head">

                    <span class="
                        field-petal fp1">
                    </span>

                    <span class="
                        field-petal fp2">
                    </span>

                    <span class="
                        field-petal fp3">
                    </span>

                    <span class="
                        field-petal fp4">
                    </span>

                    <span class="
                        field-petal fp5">
                    </span>

                    <span class="
                        field-petal fp6">
                    </span>

                    <span class="
                        field-petal fp7">
                    </span>

                    <span class="
                        field-petal fp8">
                    </span>

                    <span class="
                        field-center">
                    </span>

                </div>

            `;


            field.appendChild(
                flower
            );

        }
    );

}

</script>

</body>

</html>

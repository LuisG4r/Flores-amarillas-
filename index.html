<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Para ti 🌻</title>

<style>

/* =========================================================
   GENERAL
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}


/* =========================================================
   INTRO
========================================================= */

#intro{
    position:fixed;
    inset:0;

    background:#f8f0df;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:100;

    transition:opacity 1.2s ease;
}

.intro-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.tap-text{
    margin-top:35px;

    color:#6e5b45;

    font-size:16px;

    letter-spacing:2px;

    animation:pulseText 2s infinite;
}

@keyframes pulseText{

    0%,100%{
        opacity:.45;
    }

    50%{
        opacity:1;
    }
}


/* =========================================================
   GIRASOL INICIAL
========================================================= */

.big-sunflower{
    position:relative;

    width:190px;
    height:190px;

    cursor:pointer;

    animation:floatFlower 3s ease-in-out infinite;
}

@keyframes floatFlower{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}

.flower-center{
    position:absolute;

    width:70px;
    height:70px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:#6d3e08;

    border-radius:50%;

    z-index:5;

    box-shadow:
        inset 0 0 0 8px #81500d;
}

.petal{
    position:absolute;

    width:55px;
    height:85px;

    background:#ffd84f;

    border-radius:50%;

    left:50%;
    top:50%;

    transform-origin:center bottom;
}

.p1{
    transform:translate(-50%,-100%) rotate(0deg);
}

.p2{
    transform:translate(-50%,-100%) rotate(45deg);
}

.p3{
    transform:translate(-50%,-100%) rotate(90deg);
}

.p4{
    transform:translate(-50%,-100%) rotate(135deg);
}

.p5{
    transform:translate(-50%,-100%) rotate(180deg);
}

.p6{
    transform:translate(-50%,-100%) rotate(225deg);
}

.p7{
    transform:translate(-50%,-100%) rotate(270deg);
}

.p8{
    transform:translate(-50%,-100%) rotate(315deg);
}


/* =========================================================
   RIPPLE
========================================================= */

.ripple{
    position:absolute;

    width:30px;
    height:30px;

    border:2px solid rgba(214,170,55,.7);

    border-radius:50%;

    pointer-events:none;

    transform:translate(-50%,-50%);

    animation:rippleAnimation 1s ease-out forwards;
}

@keyframes rippleAnimation{

    from{
        width:30px;
        height:30px;
        opacity:1;
    }

    to{
        width:500px;
        height:500px;
        opacity:0;
    }
}


/* =========================================================
   SEMILLA
========================================================= */

.seed{
    position:fixed;

    width:14px;
    height:22px;

    background:#6c4317;

    border-radius:60% 40% 60% 40%;

    left:50%;
    top:35%;

    opacity:0;

    z-index:95;

    transform:rotate(25deg);
}

.seed.fall{
    animation:seedFall 2.5s ease-in forwards;
}

@keyframes seedFall{

    0%{
        opacity:0;
        transform:translate(-50%,0) rotate(25deg);
    }

    10%{
        opacity:1;
    }

    100%{
        opacity:1;
        transform:translate(-50%,420px) rotate(220deg);
    }
}


/* =========================================================
   MENSAJES
========================================================= */

#messages{
    position:fixed;
    inset:0;

    background:#f8f0df;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:90;

    opacity:0;

    pointer-events:none;

    transition:opacity 1s ease;
}

.message{
    position:absolute;

    width:85%;

    text-align:center;

    color:#65523b;

    font-size:24px;

    line-height:1.5;

    font-weight:400;

    opacity:0;

    transform:translateY(10px);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.message.show{
    opacity:1;
    transform:translateY(0);
}

.message.hide{
    opacity:0;
    transform:translateY(-10px);
}


/* =========================================================
   JARDÍN
========================================================= */

#garden{
    position:fixed;
    inset:0;

    overflow:hidden;

    opacity:0;

    transition:opacity 1.5s ease;

    z-index:1;

    /*
       Cielo arriba.
       El verde comienza aproximadamente a la mitad.
    */

    background:
        linear-gradient(
            to bottom,
            #a9ddea 0%,
            #bce4e2 35%,
            #d8e4d0 50%,
            #8fbd58 51%,
            #65a844 100%
        );
}


/* =========================================================
   SOL
========================================================= */

.sun-glow{

    position:absolute;

    width:260px;
    height:260px;

    right:8%;
    top:8%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,225,103,.7) 0%,
            rgba(255,225,103,.3) 38%,
            rgba(255,225,103,0) 72%
        );

    z-index:1;
}


/* =========================================================
   CÉSPED PRINCIPAL
========================================================= */

.grass{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    /*
       Mucho más alto.
       Aquí es donde vivirán los girasoles.
    */

    height:51%;

    background:
        linear-gradient(
            to bottom,
            #76ae48 0%,
            #5b9e3d 35%,
            #438b34 70%,
            #33772c 100%
        );

    z-index:2;
}


/* textura del césped */

.grass::before{

    content:"";

    position:absolute;

    inset:0;

    background:
        repeating-linear-gradient(
            78deg,
            rgba(255,255,255,.055) 0px,
            rgba(255,255,255,.055) 2px,
            transparent 2px,
            transparent 17px
        );

    opacity:.8;
}


/* pequeñas hierbas */

.grass::after{

    content:"";

    position:absolute;

    left:0;
    right:0;

    top:0;

    height:20%;

    background:
        linear-gradient(
            to bottom,
            rgba(57,117,40,.35),
            transparent
        );
}


/* =========================================================
   CAMPO DE GIRASOLES
========================================================= */

.sunflower-field{

    position:absolute;

    left:2%;
    right:2%;

    /*
       Los girasoles ahora están
       completamente dentro de lo verde.
    */

    bottom:2%;

    height:50%;

    overflow:visible;

    z-index:10;

    opacity:0;

    transform:translateY(35px);

    transition:
        opacity 1.6s ease,
        transform 1.6s ease;
}

#garden.ready .sunflower-field{

    opacity:1;

    transform:translateY(0);
}


/* =========================================================
   GIRASOL INDIVIDUAL
========================================================= */

.field-flower{

    position:absolute;

    width:60px;
    height:175px;

    left:var(--left);
    bottom:var(--bottom);

    transform:
        scale(var(--scale))
        rotate(var(--rotate));

    transform-origin:bottom center;

    z-index:var(--z);

    cursor:pointer;

    transition:
        transform .25s ease;
}

.field-flower:hover{

    transform:
        scale(calc(var(--scale) * 1.06))
        rotate(var(--rotate));
}


/* =========================================================
   TALLO
========================================================= */

.field-stem{

    position:absolute;

    width:7px;

    height:125px;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    background:
        linear-gradient(
            to right,
            #2c6d2c,
            #4c9639,
            #2d702d
        );

    border-radius:8px;

    z-index:1;
}


/* =========================================================
   HOJAS
========================================================= */

.leaf{

    position:absolute;

    width:55px;
    height:27px;

    background:
        linear-gradient(
            135deg,
            #4f9639,
            #2f7330
        );

    border-radius:
        100% 0 100% 0;

    z-index:2;
}

.leaf.left{

    left:-3px;

    bottom:48px;

    transform:
        rotate(-30deg);
}

.leaf.right{

    right:-5px;

    bottom:72px;

    transform:
        rotate(25deg)
        scaleX(-1);
}


/* =========================================================
   CABEZA DEL GIRASOL
========================================================= */

.field-head{

    position:absolute;

    width:60px;
    height:60px;

    left:50%;
    top:0;

    transform:translateX(-50%);

    z-index:5;
}


/* pétalos */

.field-petal{

    position:absolute;

    width:29px;
    height:43px;

    left:50%;
    top:50%;

    background:
        linear-gradient(
            to bottom,
            #ffe36a,
            #ffd047
        );

    border-radius:50%;

    transform-origin:center bottom;
}

.fp1{
    transform:translate(-50%,-100%) rotate(0deg);
}

.fp2{
    transform:translate(-50%,-100%) rotate(45deg);
}

.fp3{
    transform:translate(-50%,-100%) rotate(90deg);
}

.fp4{
    transform:translate(-50%,-100%) rotate(135deg);
}

.fp5{
    transform:translate(-50%,-100%) rotate(180deg);
}

.fp6{
    transform:translate(-50%,-100%) rotate(225deg);
}

.fp7{
    transform:translate(-50%,-100%) rotate(270deg);
}

.fp8{
    transform:translate(-50%,-100%) rotate(315deg);
}


/* centro */

.field-center{

    position:absolute;

    width:25px;
    height:25px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            #5b3205 0%,
            #70420a 65%,
            #8b5b15 100%
        );

    border-radius:50%;

    z-index:10;
}


/* =========================================================
   TENDEDero
========================================================= */

.clothesline{

    position:absolute;

    top:7%;

    left:7%;

    width:86%;

    height:190px;

    z-index:40;

    opacity:0;

    transform:translateY(-20px);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

#garden.ready .clothesline{

    opacity:1;

    transform:translateY(0);
}


/* cuerda */

.clothesline-rope{

    position:absolute;

    top:30px;

    left:2%;

    width:96%;

    height:3px;

    background:#6b4523;

    border-radius:5px;
}


/* postes */

.clothesline-post{

    position:absolute;

    top:0;

    width:15px;

    height:185px;

    background:
        linear-gradient(
            to right,
            #603b1d,
            #795025,
            #603b1d
        );

    border-radius:10px;
}

.clothesline-post.left{
    left:0;
}

.clothesline-post.right{
    right:0;
}


/* =========================================================
   PEQUEÑAS FLORES DEL CÉSPED
========================================================= */

.mini-flower{

    position:absolute;

    width:7px;
    height:7px;

    background:#fff;

    border-radius:50%;

    z-index:5;

    opacity:.8;
}


/* =========================================================
   RESPONSIVE IPHONE HORIZONTAL
========================================================= */

@media
(orientation:landscape)
and (max-height:500px){

    .big-sunflower{

        width:175px;
        height:175px;
    }

    .petal{

        width:50px;
        height:78px;
    }

    .flower-center{

        width:65px;
        height:65px;
    }

    .tap-text{

        margin-top:22px;

        font-size:14px;
    }

    .message{

        font-size:20px;

        width:80%;
    }


    /* jardín */

    .grass{

        height:52%;
    }

    .sunflower-field{

        height:51%;

        bottom:1%;
    }


    /* flores */

    .field-flower{

        width:52px;
        height:155px;
    }

    .field-head{

        width:52px;
        height:52px;
    }

    .field-petal{

        width:25px;
        height:38px;
    }

    .field-center{

        width:22px;
        height:22px;
    }

    .field-stem{

        height:110px;

        width:6px;
    }

    .leaf{

        width:47px;
        height:23px;
    }


    /* tendedero */

    .clothesline{

        top:7%;

        height:150px;
    }

    .clothesline-post{

        height:160px;

        width:14px;
    }

    .clothesline-rope{

        top:28px;
    }
}


/* =========================================================
   MODO VERTICAL
========================================================= */

@media
(orientation:portrait)
and (max-width:900px){

    #intro,
    #messages,
    #garden{

        display:none;
    }

    body::before{

        content:
        "Gira tu teléfono horizontalmente 🌻";

        position:fixed;

        inset:0;

        display:flex;

        align-items:center;

        justify-content:center;

        background:#f8f0df;

        color:#6e5b45;

        font-size:18px;

        text-align:center;

        padding:30px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     INTRO
===================================================== -->

<section id="intro">

    <div class="intro-content">

        <div
            class="big-sunflower"
            id="startFlower"
        >

            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="petal p6"></div>
            <div class="petal p7"></div>
            <div class="petal p8"></div>

            <div class="flower-center"></div>

        </div>

        <div class="tap-text">
            Presiona aquí
        </div>

    </div>

</section>


<!-- =====================================================
     SEMILLA
===================================================== -->

<div
    class="seed"
    id="seed">
</div>


<!-- =====================================================
     MENSAJES
===================================================== -->

<section id="messages">

    <div
        class="message"
        id="message1">

        A veces no hace falta tener mucho para demostrar cuánto quieres a alguien. 💛

    </div>


    <div
        class="message"
        id="message2">

        Y aunque esta vez no pude regalarte flores...

    </div>


    <div
        class="message"
        id="message3">

        Quise crear un pequeño lugar donde pudieras encontrar un pedacito de nosotros. 🌻

    </div>

</section>


<!-- =====================================================
     JARDÍN
===================================================== -->

<section id="garden">

    <div class="sun-glow"></div>


    <!-- CÉSPED -->

    <div class="grass"></div>


    <!-- GIRASOLES -->

    <div
        class="sunflower-field"
        id="sunflowerField">
    </div>


    <!-- TENDEDero -->

    <div class="clothesline">

        <div class="clothesline-post left"></div>

        <div class="clothesline-rope"></div>

        <div class="clothesline-post right"></div>

    </div>

</section>



<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const startFlower =
document.getElementById("startFlower");

const intro =
document.getElementById("intro");

const seed =
document.getElementById("seed");

const messages =
document.getElementById("messages");

const garden =
document.getElementById("garden");

const field =
document.getElementById("sunflowerField");


/* =========================================================
   CREAR GIRASOL
========================================================= */

function createFlower(){

    const flower =
    document.createElement("div");

    flower.className =
    "field-flower";


    flower.innerHTML = `

        <div class="field-head">

            <div class="field-petal fp1"></div>
            <div class="field-petal fp2"></div>
            <div class="field-petal fp3"></div>
            <div class="field-petal fp4"></div>
            <div class="field-petal fp5"></div>
            <div class="field-petal fp6"></div>
            <div class="field-petal fp7"></div>
            <div class="field-petal fp8"></div>

            <div class="field-center"></div>

        </div>


        <div class="field-stem"></div>


        <div class="leaf left"></div>

        <div class="leaf right"></div>

    `;


    return flower;
}


/* =========================================================
   GIRASOLES
========================================================= */

/*
   La distribución está hecha para que:

   - haya flores atrás
   - flores al centro
   - flores adelante
   - haya espacios entre ellas
   - todas nazcan dentro del césped
   - tengamos lugares donde esconder recuerdos
*/


const flowers = [

    /* =========================================
       FILA TRASERA
    ========================================= */

    {
        left:"1%",
        bottom:"38%",
        scale:.62,
        rotate:"-2deg",
        z:7
    },

    {
        left:"8%",
        bottom:"42%",
        scale:.58,
        rotate:"2deg",
        z:7
    },

    {
        left:"16%",
        bottom:"35%",
        scale:.68,
        rotate:"-1deg",
        z:7
    },

    {
        left:"25%",
        bottom:"43%",
        scale:.60,
        rotate:"2deg",
        z:7
    },

    {
        left:"34%",
        bottom:"36%",
        scale:.66,
        rotate:"-2deg",
        z:7
    },

    {
        left:"44%",
        bottom:"42%",
        scale:.60,
        rotate:"1deg",
        z:7
    },

    {
        left:"54%",
        bottom:"35%",
        scale:.66,
        rotate:"-1deg",
        z:7
    },

    {
        left:"64%",
        bottom:"42%",
        scale:.59,
        rotate:"2deg",
        z:7
    },

    {
        left:"74%",
        bottom:"36%",
        scale:.66,
        rotate:"-2deg",
        z:7
    },

    {
        left:"84%",
        bottom:"43%",
        scale:.60,
        rotate:"1deg",
        z:7
    },

    {
        left:"93%",
        bottom:"37%",
        scale:.66,
        rotate:"-1deg",
        z:7
    },


    /* =========================================
       FILA MEDIA
    ========================================= */

    {
        left:"4%",
        bottom:"22%",
        scale:.80,
        rotate:"-2deg",
        z:12
    },

    {
        left:"13%",
        bottom:"18%",
        scale:.86,
        rotate:"2deg",
        z:12
    },

    {
        left:"23%",
        bottom:"24%",
        scale:.78,
        rotate:"-1deg",
        z:12
    },

    {
        left:"32%",
        bottom:"16%",
        scale:.90,
        rotate:"2deg",
        z:12
    },

    {
        left:"42%",
        bottom:"23%",
        scale:.82,
        rotate:"-2deg",
        z:12
    },

    {
        left:"52%",
        bottom:"15%",
        scale:.90,
        rotate:"1deg",
        z:12
    },

    {
        left:"62%",
        bottom:"22%",
        scale:.82,
        rotate:"-1deg",
        z:12
    },

    {
        left:"72%",
        bottom:"16%",
        scale:.90,
        rotate:"2deg",
        z:12
    },

    {
        left:"82%",
        bottom:"24%",
        scale:.80,
        rotate:"-2deg",
        z:12
    },

    {
        left:"92%",
        bottom:"18%",
        scale:.86,
        rotate:"1deg",
        z:12
    },


    /* =========================================
       FILA DELANTERA
    ========================================= */

    {
        left:"9%",
        bottom:"2%",
        scale:1.02,
        rotate:"-2deg",
        z:18
    },

    {
        left:"27%",
        bottom:"0%",
        scale:1.08,
        rotate:"1deg",
        z:18
    },

    {
        left:"46%",
        bottom:"3%",
        scale:1.10,
        rotate:"-1deg",
        z:18
    },

    {
        left:"65%",
        bottom:"0%",
        scale:1.06,
        rotate:"2deg",
        z:18
    },

    {
        left:"84%",
        bottom:"3%",
        scale:1.04,
        rotate:"-2deg",
        z:18
    }

];


/* =========================================================
   CREAR CAMPO
========================================================= */

function createFieldFlowers(){

    field.innerHTML="";


    flowers.forEach(
    (data,index)=>{

        const flower =
        createFlower();


        flower.style.setProperty(
            "--left",
            data.left
        );


        flower.style.setProperty(
            "--bottom",
            data.bottom
        );


        flower.style.setProperty(
            "--scale",
            data.scale
        );


        flower.style.setProperty(
            "--rotate",
            data.rotate
        );


        flower.style.setProperty(
            "--z",
            data.z
        );


        flower.style.transitionDelay =
        `${index * 45}ms`;


        field.appendChild(flower);

    });

}


/* =========================================================
   INICIAR EXPERIENCIA
========================================================= */

let started=false;


startFlower.addEventListener(
    "click",
    startExperience
);


startFlower.addEventListener(
    "touchstart",
    startExperience,
    {passive:true}
);


function startExperience(){

    if(started)
    return;


    started=true;


    /* RIPPLE */

    const ripple =
    document.createElement("div");

    ripple.className="ripple";

    ripple.style.left="50%";

    ripple.style.top="50%";

    startFlower.appendChild(ripple);


    /* DESAPARECER GIRASOL */

    setTimeout(()=>{

        startFlower.style.transition=
        "opacity .8s ease, transform .8s ease";

        startFlower.style.opacity="0";

        startFlower.style.transform=
        "scale(.7)";

    },450);


    /* SEMILLA */

    setTimeout(()=>{

        seed.classList.add("fall");

    },800);


    /* INTRO */

    setTimeout(()=>{

        intro.style.opacity="0";

    },3300);


    /* MENSAJES */

    setTimeout(()=>{

        messages.style.opacity="1";

    },4200);


    /* MENSAJE 1 */

    setTimeout(()=>{

        document
        .getElementById("message1")
        .classList.add("show");

    },4600);


    setTimeout(()=>{

        document
        .getElementById("message1")
        .classList.remove("show");

        document
        .getElementById("message1")
        .classList.add("hide");

    },6800);


    /* MENSAJE 2 */

    setTimeout(()=>{

        document
        .getElementById("message2")
        .classList.add("show");

    },7600);


    setTimeout(()=>{

        document
        .getElementById("message2")
        .classList.remove("show");

        document
        .getElementById("message2")
        .classList.add("hide");

    },9800);


    /* MENSAJE 3 */

    setTimeout(()=>{

        document
        .getElementById("message3")
        .classList.add("show");

    },10600);


    setTimeout(()=>{

        document
        .getElementById("message3")
        .classList.remove("show");

        document
        .getElementById("message3")
        .classList.add("hide");

    },13200);


    /* PREPARAR JARDÍN */

    setTimeout(()=>{

        createFieldFlowers();

        messages.style.opacity="0";

    },13600);


    /* MOSTRAR JARDÍN */

    setTimeout(()=>{

        garden.style.opacity="1";

        garden.classList.add("ready");

    },13800);

}


/* =========================================================
   CREAR FLORES
========================================================= */

createFieldFlowers();

</script>
